# ARC 3133 — Architectural Visualization Methods 1
# Built on P2PU Course in a Box

# Project page: the site is served from https://<user>.github.io/arc3133/
# Serve locally at the same paths with:  bundle exec jekyll serve
baseurl: /arc3133
url: https://luigipacheco.github.io
repository: luigipacheco/arc3133
markdown: kramdown
permalink: /:categories/:title/

sass:
  sass_dir: _sass

exclude: [Gemfile, Gemfile.lock, README.md, "**/README.md", syllabus, reference, code, slides/src, scripts, vendor, .bundle]

defaults:
  -
    scope:
      path: "modules"
    values:
      layout: "course_page"

prose:
  media: img
  ignore:
    - /_includes
    - /_layouts
    - /_sass
    - /fonts
    - /js
    - /css

# neobrutalist palette — matches the class decks
jumbotron_color: "#000000"
jumbotron_background_image:
jumbotron_image:
