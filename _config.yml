# ARC 3133 — Architectural Visualization Methods 1
# Built on P2PU Course in a Box

baseurl:
markdown: kramdown
permalink: /:categories/:title/

sass:
  sass_dir: _sass

exclude: [Gemfile, Gemfile.lock, README.md, syllabus, reference, code, slides, scripts]

defaults:
  -
    scope:
      path: "modules"
    values:
      layout: "course_page"

prose:
  media: img
  ignore:
    - /_includes
    - /_layouts
    - /_sass
    - /fonts
    - /js
    - /css

# neobrutalist palette — matches the class decks
jumbotron_color: "#000000"
jumbotron_background_image:
jumbotron_image:
