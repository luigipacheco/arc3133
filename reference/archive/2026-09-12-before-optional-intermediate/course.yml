translation: |
  Nothing on this page is new. Every block below sat on the unit page the week you
  built it, and you have been reading `for`, `if`, `def`, lists and indices since
  Week 1 without being asked to type any of it.

  Read end to end, the nine blocks describe the whole semester: a parameter set, a
  sequence of operations, a solid assembled from its parts, a loop that places
  things, a measurement that varies them, a surface divided into cells, data you did
  not author, a shape written as a function, and that shape cut into parts a machine
  can make.

  The point is not that code is better than a graph. It is that they are the same
  description. A node group and a function both take named inputs, do one thing, and
  hand the result on. When you named an exposed input this semester you were writing
  a signature; when you set a count you were bounding a loop; when you used Compare
  and Switch you were writing an `if`.

  **Optional, for extra credit.** Take one of your own definitions — not one of
  these — and write it out as a working script, exposing the same named inputs you
  exposed in the graph. It is worth up to five points on top of the final grade, it
  is assessed on whether it runs and whether you can explain it, and nothing else in
  the course depends on it.


units:
  - id: U01
    title: Graphic Standards Manual
    url_slug: graphic-standards-manual
    vocabulary: [composition, grid, hierarchy, typography, line weight, palette]
    goal: Establish the graphic system used to communicate all later work.
    steps:
      - Compare a small set of architectural drawings and identify how hierarchy makes them readable.
      - Set page size, margins, columns, type hierarchy, line weights and a restrained palette.
      - Test the system on a diagram and a rendered image, then begin the manual.
    exercise: Make a sample 17 × 11 inch sheet and explain one decision about visual hierarchy.
    connection: Apply and revise this identity in every project and in the final booklet.
    pseudocode: |
      SHEET   = (17, 11)                 # inches
      MARGIN  = 0.75
      COLUMNS = 6

      TYPE    = {"title": 24, "heading": 14, "body": 9}
      WEIGHTS = [0.13, 0.35, 0.70]       # thin, medium, heavy
      PALETTE = ["#000000", "#FFFDF7", "#C6F035"]

      # every sheet this semester reads these six values
  - id: U02
    title: Transformations and CSG
    vocabulary: [parameter, vector, translation, rotation, scale, union, difference, intersection]
    goal: Describe a solid as an editable sequence of operations.
    steps:
      - Introduce the node editor, inputs, outputs and parameters using one primitive.
      - Move, rotate and scale procedurally; change the order and compare the result.
      - Compare union, difference and intersection between two solids, including reversing the subtraction.
      - Expose useful inputs and compose a short massing sequence.
    exercise: Show three variants of the instructor's CSG graph and diagram the ordered operations. Change one parameter at a time.
    connection: In the next unit, replace a primitive Boolean cutter with geometry built from points and faces.
    teaching_note: >-
      In the class file, intersect a cube and sphere, union three perpendicular
      cylinders, then subtract the cylinders. Parameters remain visible on the
      native nodes. Join Geometry is an optional comparison, not the final output.
    pseudocode: |
      solid = intersection(box(1, 1, 1), sphere(r=0.65))
      z_cut = cylinder(r=0.30, h=2)
      y_cut = rotate(z_cut, x=90)        # degrees
      x_cut = rotate(z_cut, y=90)
      cutters = union(z_cut, y_cut, x_cut)
      result = difference(solid, cutters)
  - id: U03
    title: Geometry from scratch
    vocabulary: [point, vector, parameter, vertex, line, edge, face, mesh, solid, normal]
    goal: Explain the structure behind geometry and build a parametric solid from its parts.
    steps:
      - Point — use an XYZ vector to locate one point; distinguish a position from a displacement.
      - Line — connect two point positions as a curve.
      - Edge — identify two mesh vertices and the connection between them.
      - Face — order corners around a boundary and make a face; explain its normal.
      - Mesh and solid — return to the multiple-face exercise. Build four base corners and an apex, join four triangular side faces and a base face, and check that the pyramid is closed.
      - Boolean — subtract this pyramid from a cube and connect the result to the preceding CSG assignment.
    exercise: Keep Width, Depth and Height exposed. Show the five pyramid vertices, eight edges and five faces, then demonstrate the cube-minus-pyramid operation.
    connection: Save a reusable parametric object for arrays and later attractor controls.
    pseudocode: |
      verts = [[-w, -d, 0],              # 0
               [ w, -d, 0],              # 1
               [ w,  d, 0],              # 2
               [-w,  d, 0],              # 3
               [ 0,  0, h]]              # 4  apex

      faces = [[0, 1, 4], [1, 2, 4],
               [2, 3, 4], [3, 0, 4],
               [0, 3, 2, 1]]             # the base — do not forget it

      pyramid = mesh(verts, faces)
      result  = difference(cube, pyramid)
  - id: U04
    title: Arrays and lists
    vocabulary: [list, index, count, loop, nested loop, conditional, modulo, sine, amplitude, frequency, phase]
    goal: Generate positions in an ordered collection, then control selected positions with a rule.
    steps:
      - Start with a small linear array. Show the list, count and index, then construct repetition with Repeat Input and Repeat Output in a Repeat Zone.
      - Use Compare and Switch to express an if condition; compare the result at two counts.
      - Nest repetition to make a grid. Identify the row and column and predict the total count.
      - Build a hexagonal array by staggering alternate rows and using consistent row spacing; explain the odd/even test.
      - Build a radial array from radius, count and angular step.
      - Select a range of indices with comparisons and move only those points up or down.
      - Use Math set to Sine to control height; vary amplitude, frequency and phase. Place cubes on the displaced line and repeat the row.
      - Finish with a 3D cube array. Repeat a row in Y to make a grid, then repeat the grid in Z to make layers. Predict Count cubed and distinguish cube instances from a sampled volume.
    exercise: Reuse one component in linear, grid, hexagonal and radial studies. Develop three for the sheet, including the nested grid, a conditional change and a sine-driven variation. Finish the file with a small 3D cube array and compare counts of 3, 4 and 5 per axis.
    connection: The next unit replaces an index-based rule with a measurement from an external object. The final XYZ array introduces the 3D sampling locations used later for volumes.
    pseudocode: |
      points = []

      for j in range(rows):                      # nested loop = grid
          offset = spacing / 2 if j % 2 else 0   # odd/even stagger
          for i in range(cols):
              z = amplitude * sin(i * frequency + phase)
              if 3 <= i <= 5:                    # Compare + Switch
                  z = z + lift
              points.append([i * spacing + offset, j * row_gap, z])
    teaching_note: Teach both example files together. A field evaluated across elements is not itself a Repeat Zone; show explicit iteration first, then compare with an efficient field-based construction. In the revised sine example, cubes follow the displaced line and a second Instance on Points repeats the whole row. Keep Grasshopper data-tree terminology distinct from Blender field evaluation.
  - id: U05
    title: Attractors
    vocabulary: [distance, external condition, field, remap, clamp, falloff, nearest]
    goal: Vary a parameter in response to an external condition.
    steps:
      - Measure distance to one point and display the values as a grayscale field before changing geometry.
      - State the input distance range and the output parameter range; remap and clamp deliberately.
      - Compare a single-point attractor, multiple points using the nearest distance, and the nearest location on a curve.
      - Drive size, height or rotation, holding the array and component constant while comparing the three attractor types.
    exercise: Show the field, the mapping and the resulting form. Move the attractor and explain the response.
    connection: Use the same measurement-and-remapping logic to vary a lattice and later to analyze an imported point cloud.
    pseudocode: |
      for p in points:
          d = distance(p, attractor)             # or min(...) over several
          t = (d - d_min) / (d_max - d_min)      # remap
          t = clamp(t, 0, 1)
          t = falloff(t)                         # linear, inverse, smooth, step
          size = out_min + t * (out_max - out_min)
          place(component, p, scale=size)
  - id: U06
    title: Tessellation and lattices
    vocabulary: [cell, adjacency, tessellation, lattice, node, strut, aperture, thickness]
    goal: Turn repetition into a connected surface or spatial system.
    steps:
      - Distinguish a tessellation covering a surface from a lattice formed by connected nodes and struts.
      - Begin with a small repeated cell; inspect shared boundaries, gaps and connectivity.
      - Vary aperture, depth or strut thickness with the previous attractor logic.
      - Test one physical connection, then plan a small modular assembly and its print orientations.
    exercise: Compare a uniform system with a controlled variation, then make one connection or cell test before a batch.
    connection: Carry the visual study into the modular fabrication milestone; preserve the parametric relationships.
    pseudocode: |
      for cell in subdivide(surface, u, v):
          panel = morph(component, cell)         # component into the cell
          d = distance(center(cell), attractor)
          panel.aperture = remap(d, d_min, d_max, 0.1, 0.9)
          panel.depth    = remap(d, d_min, d_max, 2.0, 12.0)
          keep(panel)
  - id: U07
    title: Point clouds and the transition to volumes
    vocabulary: [sample, point cloud, origin, units, decimation, density, voxel, radius]
    goal: Read measured or imported points as data and explain how a volume is inferred from them.
    steps:
      - Import a supplied or attributed point cloud; record source, units, origin and the original point count.
      - Crop or decimate deliberately, recording the new count and what detail is lost.
      - Reuse point and curve distance measurements to color, filter or displace the samples, with a stated analytical purpose.
      - Convert a copy to a volume. Compare point radius or influence, voxel size and the resulting density or distance representation.
    exercise: Present the original samples, an analytical field and a volume conversion side by side. Retain the original cloud in the file.
    connection: A point cloud is discrete data. The next unit studies the volumetric field used to reconstruct or design continuous form.
    pseudocode: |
      cloud = load("site.ply")
      print(len(cloud))                          # state this before

      cloud = decimate(cloud, keep=0.05)
      print(len(cloud))                          # and after

      for p in cloud:
          p.density = len(within(cloud, p, radius))

      volume = voxelize(cloud, size=0.5)
  - id: U08
    title: Volumetric fields and signed distance
    vocabulary: [scalar field, implicit surface, signed distance field, density, isosurface, threshold, noise, resolution]
    goal: Describe a shape through values in space and control the boundary those values define.
    steps:
      - Compare explicit mesh faces with a volumetric scalar field. Distinguish density from signed distance.
      - Begin with a simple signed distance example; identify inside, outside and the zero boundary.
      - Revisit union, intersection and difference as field combinations and compare them to the earlier solid Boolean.
      - Drive the field with noise, textures and external measurements. Change one influence at a time.
      - Extract an isosurface and compare two voxel sizes or sampling resolutions before refining.
    exercise: Make controlled volume variants and show one readable cut or field diagram explaining what defines the surface.
    connection: Reuse the chosen volume for contour sections and fabrication; graphic textures alone do not change geometry.
    pseudocode: |
      def field(p):                              # a shape as a function
          a = sphere_sdf(p, center_a, r_a)
          b = box_sdf(p, center_b, size_b)
          return smooth_min(a, b, k)             # the blend comes free

      grid    = sample(field, bounds, resolution)
      surface = extract(grid, iso=0.0)           # where the field is zero
    teaching_note: A noise-modified implicit field is not automatically an exact signed distance field. Keep the distinction visible and introduce specialized groups only when their inputs and outputs can be explained.
  - id: U09
    title: Contour sections and physical parts
    vocabulary: [section plane, contour, interval, discretization, thickness, registration, kerf, nesting]
    goal: Translate a volumetric design into ordered curves and a buildable set of parts.
    steps:
      - Intersect the volume or its extracted boundary with a sequence of planes; order the resulting contour curves.
      - Compare two section directions and intervals, including the relationship between gaps, light and the reading of the form.
      - Close and clean the intended profiles; turn them into parts with material thickness and a clear registration system.
      - Test fit and kerf, then number, nest and fabricate the parts and document the assembly.
    exercise: Compare the continuous volume, its ordered contours and the discrete assembly. Explain what is lost and gained in the translation.
    connection: Bring the digital studies, physical result and process documentation together in the final booklet.
    pseudocode: |
      sections = []
      for k in range(count):
          z = z0 + k * interval
          sections.append(slice(volume, z))      # ordered, and order matters

      for i, s in enumerate(sections):
          s = offset(s, kerf / 2)                # the blade has width
          label(s, i)
          nest(s, sheet)
    teaching_note: Designed section parts are distinct from the layers a printer slicer generates. Decide which curves are part boundaries before assigning thickness or sending machine files.
projects:
  - id: P1
    title: Geometry — from operations to construction
    units: [U02, U03]
    description: Build a parametric massing study, reconstruct its cutter from basic geometry, and develop a small printable variant.
    milestones:
      - id: P1a
        title: CSG massing sequence
        kind: visual
        release: 2
        due: 4
        weight: 7
        requirements:
          - One 17 × 11 inch sheet with the ordered transformation/Boolean diagram, a final axonometric and three parameter variants.
          - Demonstrate translation, rotation and scale, and compare union, difference and intersection. Clearly identify the operands of subtraction.
          - Submit an editable graph with exposed inputs and geometry generated in the graph. Keep the source operations intact.
      - id: P1b
        title: Mesh from scratch
        kind: visual
        release: 3
        due: 5
        weight: 7
        requirements:
          - One sheet showing point, line, edge, face and the multiple-face mesh exercise, with an annotated closed pyramid.
          - Build four base corners and an apex with Width, Depth and Height exposed; include all four side faces and the base.
          - Reuse the pyramid as a Boolean cutter in the previous study and show at least three parameter settings. Explain face order, normals and closure.
      - id: P1c
        title: First print
        kind: fabrication
        release: 3
        due: 8
        checkpoints: [{week: 5, text: 'Review print-ready geometry, physical units, orientation and the sliced preview before queueing.'}]
        weight: 7
        requirements:
          - Develop a printable variant of the geometry project, within 60 mm on each axis and the 200 g allocation, with no supports.
          - Present the physical print at midterm with one orientation/process sheet and a photograph.
          - Submit the editable source, exported mesh and slicer project. Explain any geometry changes made for printability.
  - id: P2
    title: Repetition and response — arrays to attractors
    units: [U04, U05]
    description: Use the geometry project as a component. First design its arrangement, then vary it through external measurements.
    milestones:
      - id: P2a
        title: Arrays and conditional control
        kind: visual
        release: 4
        due: 8
        weight: 7
        requirements:
          - Practice linear, nested-grid, hexagonal and radial arrays; develop three comparisons on up to two sheets, including the nested grid.
          - Keep the component constant while comparing arrangements. Expose count and spacing or radius and explain index order.
          - Show one conditional index-range displacement and one sine-driven variation; identify amplitude, frequency and phase.
          - Build the repetition and selection logic from basic nodes. Show a small inspectable count before scaling up; no minimum of 1,000 elements is imposed.
      - id: P2b
        title: Attractor field study
        kind: visual
        release: 6
        due: 9
        checkpoints: [{week: 8, text: Bring the grayscale field and a first geometric response to midterm as work in progress.}]
        weight: 7
        requirements:
          - On up to two sheets, compare single-point, multiple-point and curve attractors using the same component and arrangement.
          - Show the measured field before the geometric result. State source and target ranges, clamping and falloff.
          - Develop one spatial or architectural intention and demonstrate a live change to the attractor or mapping.
  - id: P3
    title: Connected systems — tessellation and lattices
    units: [U06]
    description: Develop the repeated component into a tessellated surface or lattice and test how its connections make a physical system.
    milestones:
      - id: P3a
        title: Tessellation and lattice study
        kind: visual
        release: 7
        due: 10
        weight: 7
        requirements:
          - Compare a basic tessellation and lattice, then develop one as a surface, screen or spatial fragment on up to two sheets.
          - Show a uniform state and at least two controlled variants; vary two relevant parameters such as aperture, depth or strut thickness.
          - Explain shared boundaries or connections and show how the attractor logic changes the system.
      - id: P3b
        title: Modular print assembly
        kind: fabrication
        release: 7
        due: 13
        checkpoints: [{week: 10, text: Review one connection test and a production plan before the nine-part batch.}]
        weight: 7
        requirements:
          - Produce a 3 × 3 assembly of nine components, including controlled variation, within 300 mm on each assembled axis.
          - Test and document a connection, thickness, orientation and fit before production. Justify any supports and respect the confirmed machine allocation.
          - Submit the assembly, editable source and fabrication files, plus a sheet showing the part map, assembly sequence and photographs.
  - id: P4
    title: Samples, fields and sections
    units: [U07, U08, U09]
    description: Analyze a point cloud, develop a volumetric interpretation or design, and discretize the selected volume into physical sections.
    milestones:
      - id: P4a
        title: Point-cloud analysis
        kind: visual
        release: 9
        due: 11
        weight: 7
        requirements:
          - One or two sheets comparing source samples, a distance-based analysis and a volume conversion.
          - Record data source and permission/license, model units, origin, original count, processed count and sampling choices.
          - Explain the analytical purpose and what radius/influence and voxel size change. Retain the original points alongside derived outputs.
      - id: P4b
        title: Volume, section and light
        kind: visual
        release: 10
        due: 14
        checkpoints: [{week: 12, text: Select the volume and compare two section directions before developing physical parts.}]
        weight: 7
        requirements:
          - Two sheets showing a controlled volumetric study, its field/Boolean logic and three parameter variants.
          - Compare two section directions or intervals and develop one ordered contour stack; render its light, shadow and material reading.
          - Explain whether the field is density, signed distance or another implicit function, and document sampling resolution and surface extraction.
      - id: P4c
        title: Sectional fabrication
        kind: fabrication
        release: 12
        due: final
        checkpoints: [{week: 13, text: 'Review a fit/kerf test, registered parts and the nested cutting file before full production.'}]
        weight: 7
        requirements:
          - Translate the chosen volume into at least 12 ordered section parts with material thickness, labels and a registration or connection system.
          - Fit the assembly within 300 mm on each axis and nest within one confirmed material sheet. Include test cuts in the allocation.
          - Present the assembly with the editable source, cutting file, assembly diagram and photographs, comparing continuous form with discrete parts.
assessments:
  - id: GSM
    title: Graphic Standards Manual
    url_slug: graphic-standards-manual
    release: 1
    due: 8
    weight: 7
    checkpoints: [{week: 2, text: Bring a sample sheet for an ungraded identity check.}, {week: final, text: Submit the revised manual as a separate PDF alongside the booklet.}]
    requirements:
      - At least eight pages defining the graphic system and showing tested applications.
      - Specify page grid, margins, typography, color, line weights, annotation, captions and image treatment.
