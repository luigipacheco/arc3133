instructor_notes: |
  The earlier materials disagreed about module numbering, due dates, project weights, the role of Python and the placement of point clouds, tessellation and sections. Their original versions are preserved in the dated archive. This revision uses unit identifiers for topics and project identifiers for assessment so that extending a topic does not require renumbering the entire course.

  The main pacing risk is arrays: linear, nested grid, hexagonal and radial construction, conditionals and sine control are several lessons. Use the two-session allocation as a starting point, revisit individual operations through attractors, and extend guided practice when students cannot explain index order or predict a count. Use small examples; large element counts are not evidence of understanding.

  Attractors introduce measurement rather than another arrangement. Tessellation and lattices add connectivity. Point clouds introduce data the student did not author. Volumes introduce a new representation, and sections translate that representation into buildable parts. Make each transition explicit and retain a before/after comparison.

  The midterm is a review of completed foundations and arrays, with developing attractor and tessellation work. Avoid also requiring those two later studies to be finished for the same review. Reserve production time in the later semester and verify lab capacity before committing the cohort to a batch.

  Keep institutional policy text separate from curriculum edits. The School's accreditation mapping remains unconfirmed; do not present the earlier mixed 2014/2020 criteria table as a verified current requirement.

# ─────────────────────────────────────────────────────────────────────────────
# RELEASE CONTROL — what students can actually open.
#
# A page listed here is built and linked. Everything else is held back: the
# page is not written to the site at all, and every link pointing at it turns
# into plain text marked "not yet released". The row stays visible in the
# calendar and the index, so students can see what is coming without being
# able to run ahead.
#
# The weekly move is one edit: add the week number and the unit ids the
# morning of the class, then run  python scripts/sync_course.py
#
# Use the word  all  on either line to publish everything.
# To preview the whole site locally without editing this file:
#     SYNC_RELEASE=all python scripts/sync_course.py
#
# assignments takes project ids (P1…P4) and the standalone ones (GSM, MID, BOOK).
# A project is released whole: listing P2 posts P2a and P2b with it. The
# assignment overview page is always posted — it is the index, and its table is
# how students see what is still coming.
# ─────────────────────────────────────────────────────────────────────────────
# HOME PAGE — the landing page students actually read.
#
# Narrative first, tables second. The four projects are the spine; the nine
# units are how the spine is taught. Everything here is prose you can edit
# freely — the tables underneath are generated from the sequence itself.
home:
  tagline: >-
    A course on computational design for architectural representation —
    describing geometry as operations and rules, varying it with data, and
    making the result physical.
  teaching: |
    Students build systems as graphs, where the flow of data is visible: you can
    see where a value comes from, what transforms it, and where it goes.

    Code is not absent. Every lesson carries the same task written out as a few
    lines of Python, beside the nodes that perform it. You are not asked to type
    it. You are asked to read it, and to check that it says what you just built.
    In the last week those blocks are collected onto a single page, and the
    language you have been reading turns out to be one you can already follow.

    Bring the editable file to every class, and be able to change one input and
    predict what changes. That, rather than a finished image, is what a review
    is looking for.
  making: |
    Every project ends in something physical. Fabrication runs through two modes
    of computer-controlled making — additive and cutting — introduced at object
    scale with a first small print, and returning at system scale as a modular
    assembly and a set of cut sections.

    The FabLab Safety Orientation comes before any machine use. Preparation,
    test pieces and documentation are part of the work rather than an
    afterthought at the end of it.

