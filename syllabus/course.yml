blender:
  version: Blender 5.2.1 LTS
  version_note: >-
    Earlier Blender versions may lack the volume nodes used in the later
    classes.
  reference_note: >-
    Build your own file. Use these examples to check a step when you are stuck,
    then return to your work. Do not submit the example files.
  how_to_use: >-
    Select the lesson object; press Home over the node editor to see the graph.
    Follow the Frames in order. Change inputs on the nodes or, where provided,
    in the GeometryNodes modifier.
  sessions:
    - id: S01
      title: Constructive Solid Geometry
      path: files/blender/01-intro-geometry-nodes/Intro-Geometry-Nodes.blend
      focus: Build the instructor's three-operation CSG example from native primitives and rotated cylinders.
      exercise: Make three variants by changing one parameter at a time. Diagram Intersection, Union and Difference in the order used.
      scenes: [01 - CSG example]
      note: >-
        The instructor's graph uses Intersection, rotated cylinders, Union and
        Difference. Read the Frames in order. Change Radius, Size, Translation,
        Rotation or Scale on the native nodes; these controls are not in the modifier.
    - id: S02
      title: Descriptive Geometry
      path: files/blender/02-geometry-fundamentals/GEOMETRY101-class-ready.blend
      focus: Build geometry from coordinates, then use the parametric pyramid as a Boolean cutter.
      exercise: Show a point, line, edge, face, solid pyramid and cube-minus-pyramid result. Keep Width, Depth and Height exposed; include a mesh with multiple faces.
      scenes: [Point, Line, Edge, Face, Solid, Boolean]
      note: >-
        Follow the six main teaching scenes. Original reference scenes remain in the file. The pyramid keeps Width, Depth and Height
        exposed and the file ends with cube-minus-pyramid. This is a model-units
        lesson, not a fabrication export.
    - id: S03
      title: 'Arrays — Part 1: linear and nested grid'
      path: files/blender/03-arrays-lists/Arrays-Lists-Session-1.blend
      focus: Begin with a linear array, then nest a loop to build a grid.
      exercise: Repeat the previous geometry along a line and across a grid. Compare two counts and two spacings.
      scenes: [Linear loop, Nested grid]
    - id: S04
      title: 'Arrays — Part 2: arrangements and rules'
      path: files/blender/03-arrays-lists/Arrays-Lists-Session-2.blend
      focus: Begin with the simple 3D cube array, then compare hexagonal and radial arrangements and select index ranges. End with the 3D curve array to show how math can shape a volume.
      exercise: Build the XYZ array and predict Count cubed. Then make one hexagonal or radial arrangement and one conditional range change. End with a 3D curve-array volume shaped by sine relationships.
      scenes: [3D array, Hexagonal array, Radial array, If and range, Sine curve]
      note: Before hexagonal arrays, the simple 3D array repeats a row into a grid and a grid into layers; Count, Spacing and Cube Size remain exposed. The last scene, Sine curve, uses math along X and Y and repetition in three dimensions to shape a volume of cubes. It introduces the later density and signed-distance lessons while retaining cube instances.
    - id: S05
      title: Attractor
      path: files/blender/04-attractors/Attractors.blend
      focus: Vary parameters using distance to one point, multiple points and a curve.
      exercise: Compare all three attractor types on the same array and show how moving an attractor changes the result.
      scenes: [Read the field, One point, Multiple points, Curve attractor]
    - id: S06
      title: Optional — Tessellation and Lattices
      path: files/blender/05-tessellation-lattices/Tessellation-and-Lattices.blend
      focus: Optional intermediate exploration of tessellated surfaces and lattices after arrays or attractors.
      exercise: If this optional class is offered, compare a tessellation and a lattice from the earlier component. This exploration is not a required graded submission.
      note: The existing file covers tessellation and lattices. Panelization and simulation are possible additions to this intermediate class and are not yet demonstrated here.
      scenes: [Tessellation, Lattice, Attractor lattice]
    - id: S07
      title: Volumetric Data and Fields — point clouds
      path: files/blender/06-point-clouds-volumes/Point-Clouds-and-Volumes.blend
      focus: Import points, analyze their relationship to an attractor and convert the samples into a volume.
      exercise: Show the imported samples, an attractor-based analysis and the resulting volume at two resolutions.
      scenes: [Import points, Analyze points, Points to volume]
      extras:
        - [Teaching point cloud, files/blender/06-point-clouds-volumes/teaching-courtyard.ply]
        - [Dataset source and units, files/blender/06-point-clouds-volumes/teaching-courtyard.json]
      note: >-
        Keep the data folder together — the file reads teaching-courtyard.ply
        from beside it. It is a synthetic teaching cloud, not a survey.
    - id: S08
      title: Volumetric Data and Fields — signed distance and Booleans
      path: files/blender/07-advanced-volumes/Advanced-Volumes-Session-1.blend
      focus: Read signed distance values and compare Boolean combinations of volumetric fields.
      exercise: Compare union, intersection and difference of the same two fields and explain the zero boundary.
      scenes: [Mesh to SDF, Signed distance, SDF Boolean]
    - id: S09
      title: Volumetric Data and Fields — noise and surface extraction
      path: files/blender/07-advanced-volumes/Advanced-Volumes-Session-2.blend
      focus: Use noise to vary a volumetric field and extract its surface.
      exercise: Make two controlled noise variations and compare sampling resolutions. Select one volume for the contour sessions.
      scenes: [Noise field]
    - id: S10
      title: Discretizing Geometry — contours
      path: files/blender/08-discretizing-geometry/Discretizing-Geometry-Session-1.blend
      focus: Slice the chosen form into ordered contour curves.
      exercise: Compare two section intervals or directions and show how the curves describe the continuous form.
      scenes: [One contour, Contour stack]
    - id: S11
      title: Discretizing Geometry — section parts
      path: files/blender/08-discretizing-geometry/Discretizing-Geometry-Session-2.blend
      focus: Convert section profiles into numbered physical parts and a cutting layout.
      exercise: Assign material thickness, test registration and arrange a small set of parts for a fit test.
      scenes: [Section parts, Laid out parts]
    - id: S12
      title: Final — fabrication and assembly
      path: files/blender/09-final-project/Final-Project-Fabrication.blend
      focus: Fabricate, test and revise the selected system, then assemble its documentation into the booklet.
      exercise: Produce one fabrication test, document the revision it requires, and prepare the digital files, photographs and diagrams for the final booklet.
      scenes: [Print orientation, Fit coupon, Modular print, Registered sections, Cutting layout, Spacer rings]
      extras:
        - [Fabrication notes and dimensions, files/blender/09-final-project/FABRICATION-NOTES.md]
        - [Small print STL, files/blender/09-final-project/small-print-mm.stl]
        - [Fit coupon STL, files/blender/09-final-project/fit-coupon-mm.stl]
        - [Modular parts STL, files/blender/09-final-project/modular-parts-mm.stl]
        - [Section parts and spacers SVG, files/blender/09-final-project/section-parts-and-spacers-mm.svg]
      note: >-
        The exported files are default-parameter snapshots in millimetres.
        Regenerate them after edits and test physical fit before production.
        Modular parts are an optional reference. The required physical outputs
        are the CSG print (P2b) and laser-cut volume (P4b).

