translation: |
  Nothing on this page is new. Every block below sat on the unit page the week you
  built it, and you have been reading `for`, `if`, `def`, lists and indices since
  Week 1 without being asked to type any of it.

  Read end to end, these blocks describe the whole semester: a parameter set, a
  sequence of operations, a solid assembled from its parts, a loop that places
  things, a measurement that varies them, a surface divided into cells, data you did
  not author, a shape written as a function, and that shape cut into parts a machine
  can make.

  The point is not that code is better than a graph. It is that they are the same
  description. A node group and a function both take named inputs, do one thing, and
  hand the result on. When you named an exposed input this semester you were writing
  a signature; when you set a count you were bounding a loop; when you used Compare
  and Switch you were writing an `if`.

  **Optional, for extra credit.** Take one of your own definitions — not one of
  these — and write it out as a working script, exposing the same named inputs you
  exposed in the graph. It is worth up to five points on top of the final grade, it
  is assessed on whether it runs and whether you can explain it, and nothing else in
  the course depends on it.


units:
- id: U01
  title: Graphic Standards Manual
  url_slug: graphic-standards-manual
  vocabulary:
  - composition
  - grid
  - hierarchy
  - typography
  - line weight
  - palette
  goal: "Set up the graphic system you will use to present all your later work."
  steps:
  - Compare architectural drawings and identify how hierarchy makes them readable.
  - "Study the three manuals below. In each, find one rule, the drawing that
    shows it at size, and a place where it is applied."
  - "Set the page size, margins, columns, type hierarchy, line weights and a
    restrained color palette."
  - Test the system on a diagram and render, then assemble the four-page manual.
  exercise: Make a sample 17 × 11 inch sheet and explain one decision about visual hierarchy.
  connection: "Apply this system — and keep revising it — in every project and
    in the final booklet."
  references: manuals
  pseudocode: |
    PAGES     = 4                # the whole manual
    SHEET     = (17, 11)         # inches
    MARGIN    = 0.75
    COLUMNS   = 6

    TYPEFACES = 2                # 3 is the ceiling
    TYPE      = {"title": 24, "heading": 14, "body": 9}
    WEIGHTS   = [0.13, 0.35, 0.70]     # thin, medium, heavy
    COLORS    = 2                # up to two colors, plus the background
    BACKGROUND = "#FFFFFF"       # white or dark
    PALETTE   = ["#2455A4", "#E58B32"]  # complementary blue/orange

    # every sheet this semester reads these values
- id: U02
  title: Constructive Solid Geometry
  url_slug: transformations-and-csg
  videos:
  - - Blender
    - https://www.youtube.com/watch?v=HO50aaKbfHY
  - - Rhino + Grasshopper
    - https://www.youtube.com/watch?v=z0UFlXQnk3g
  vocabulary:
  - parameter
  - vector
  - translation
  - rotation
  - scale
  - union
  - difference
  - intersection
  goal: "Build solids you can keep editing, using move, rotate, scale and
    Boolean operations."
  steps:
  - "Start with one primitive. Find the node's inputs, outputs and parameters."
  - "Move, rotate and scale it. Change the order and compare the results."
  - Compare union, intersection and difference. Reverse a subtraction and explain what changes.
  - "Expose the useful inputs and build a short massing sequence."
  - "In Week 3, check that the CSG object is closed and the right physical size.
    Export a mesh and, in the FabLab slicer, check the orientation, supports,
    material use and layer preview."
  exercise: "Draw your CSG steps as a BIG-style process diagram — one operation
    per frame, read left to right — and change one parameter to show what it
    does."
  connection: "Next, Descriptive Geometry replaces a primitive cutter with a
    shape you build from points and faces. Week 3 introduces 3D printing: you
    use units, orientation and slicing to prepare your CSG object for its first
    print."
  teaching_note: In the class file, intersect a cube and sphere, union three perpendicular cylinders, then
    subtract the cylinders. Parameters remain visible on the native nodes. Join Geometry is an optional comparison,
    not the final output. For the print, confirm the exported dimensions in the slicer and record the settings
    and any geometry changes in the P2b submission notes.
  pseudocode: |
    # Example sequence; intersection is optional in the assignment.
    # Use six to nine frames to explain your own operation sequence.

    box     = cube(1.0)                  # 1  primitive
    ball    = sphere(r=0.65)             # 2  primitive
    rod     = cylinder(r=0.30, h=2.0)    # 3  primitive

    ball    = scale(ball, 1.15)          # 4  scale
    ball    = translate(ball, z=0.15)    # 5  translate
    rod_y   = rotate(rod, x=90)          # 6  rotate - degrees
    rod_x   = rotate(rod, y=90)          # 6  same operation

    solid   = intersection(box, ball)    # 7  intersection
    cutters = union(rod, rod_y, rod_x)   # 8  union
    result  = difference(solid, cutters) # 9  difference

    # 9 keeps solid, removes cutters. draw 9 again at
    # building scale: a figure, planting, ground, shadow.
- id: U03
  title: Descriptive Geometry
  url_slug: geometry-from-scratch
  videos:
  - - Blender
    - https://youtu.be/JQN7IjVIW4A
  - - Rhino + Grasshopper
    - https://www.youtube.com/watch?v=g-iOvUYX6Yg
  vocabulary:
  - point
  - vector
  - parameter
  - vertex
  - line
  - edge
  - face
  - mesh
  - solid
  - normal
  goal: "Describe geometry as points, lines, edges and faces, then build a solid
    you control with parameters."
  steps:
  - "Point — place a point with X, Y and Z values; tell a position (where
    something is) from a displacement (how far it moves)."
  - Line — connect two positions with a curve.
  - Edge — connect two mesh vertices.
  - "Face — put its corners in order and explain which way its normal (its front
    side) points."
  - "Solid — build a pyramid from four base corners and a top point (the apex).
    Add four side faces and a base, and check that it is closed."
  - Boolean — subtract the pyramid from a cube, revisiting CSG.
  - "Panel — define its parameters, calculate the corner points and put the
    faces in order. Check that it stays closed and tiles across the full range
    of each parameter."
  exercise: "Keep Width, Depth and Height as exposed inputs. Show the pyramid's
    five vertices, eight edges and five faces, and subtract it from a cube. Then
    build your own module and render it with one material you make, on a ground
    plane, with three-point lighting (key, fill and rim)."
  connection: "You will use this module for the panel arrays on Sheets 1–2 of
    3.2, then vary one of its dimensions with an attractor in 3.3. The CSG
    object stays a separate, earlier print."
  pseudocode: |
    verts = [[-w, -d, 0],              # 0
             [ w, -d, 0],              # 1
             [ w,  d, 0],              # 2
             [-w,  d, 0],              # 3
             [ 0,  0, h]]              # 4  apex

    faces = [[0, 1, 4], [1, 2, 4],
             [2, 3, 4], [3, 0, 4],
             [0, 3, 2, 1]]             # the base — do not forget it

    pyramid = mesh(verts, faces)
    result  = difference(cube, pyramid)
- id: U04
  title: Arrays
  url_slug: arrays-and-lists
  vocabulary:
  - list
  - index
  - count
  - loop
  - nested loop
  - conditional
  - modulo
  - sine
  - amplitude
  - frequency
  - phase
  goal: "Arrange your panel with lists, loops and if statements, then carry the same rules into a 3D array."
  videos:
  - - Blender · Arrays part 1
    - https://youtu.be/q1z8YI7ExtY
  - - Rhino + Grasshopper · GH list
    - https://www.youtube.com/watch?v=ylHphXclA9w
  - - Rhino + Grasshopper · Arrays part 1
    - https://www.youtube.com/watch?v=ctf8qUgi_ZI
  - - Rhino + Grasshopper · Arrays part 2
    - https://www.youtube.com/watch?v=ymUSyCUqTL4
  steps:
  - "1D: build a small row with Repeat Input and Repeat Output. Find the list,
    the count and the index."
  - "2D: put the row inside a second loop to make a grid. Name the rows and
    columns, and predict the total count."
  - "3D: stack the grid in layers to make a cube of copies. Before you look,
    predict how many there are (Count × Count × Count). These are separate
    copies of one object, not a solid block."
  - "Curve: bend the row. Place your module at evenly spaced points along a
    curve, each turned to follow the curve's direction. The count is the curve's
    length ÷ the spacing."
  - "Pattern example · Brick wall: stack rows of bricks along a curve, one
    course at a time, and shift every other course by half a brick (k modulo 2).
    Then swap the curve for a circle."
  - "Use Compare and Switch to write if rules; make four different façade
    patterns by changing selected copies of your panel."
  - "3D patterns: build a 3D array of cubes and let if/Switch rules on the row, column and layer index (i, j, k) drive a parameter — the Switch picks one of two values for size, rotation or height, or keeps or removes the cube. Use the layer index in at least one rule, so the pattern changes from layer to layer as well as across it."
  - "Optional practice · Change the cubes' height with a function of X and Y, such as sine or cosine, while keeping the layers in Z (the Sine curve scene)."
  - "Optional practice · Hexagonal: shift every other row; explain the odd/even
    test and the row spacing."
  - "Optional practice · Radial: place copies around a circle from a radius, a
    count and an angle step."
  - "Optional practice · Drive the curve with a sine wave; explain amplitude
    (how high), frequency (how often it repeats) and phase (where it starts)."
  exercise: "3.2 has three sheets. Sheet 1: four diagrams — your module alone,
    then in 1D, 2D and 3D arrays. Sheet 2: four façade patterns, made by
    applying if/Switch rules to a 2D array of your module. Sheet 3: two isometrics of a 3D array of cubes in which if/Switch rules on the row, column and layer index switch a parameter between two values; at least one rule uses the layer."
  connection: "Sheets 1–2 of 3.2 reuse your panel, and your rules may change or
    remove some of the copies. Sheet 3 uses cubes. You may use the supplied
    material library or your own materials. In 3.3 you'll use the distance to a
    point or a curve to change one dimension of your panel across a façade."
  pseudocode: |
    # Arrays class 1: line -> grid -> cube -> curve.
    row = []
    for i in range(nx):
        row.append(place_module(i * dx, 0, 0))

    grid = []
    for j in range(ny):
        for i in range(nx):
            grid.append(place_module(i * dx, j * dy, 0))

    spatial_array = []
    for k in range(nz):
        for j in range(ny):
            for i in range(nx):
                spatial_array.append(place_module(i * dx, j * dy, k * dz))

    # the row, bent onto a curve: the curve supplies each position
    count = int(curve_length(curve) / spacing) + 1
    curved_row = []
    for i in range(count):
        t = i / (count - 1)                     # 0 at the start, 1 at the end
        p, d = point_on(curve, t), direction_on(curve, t)
        curved_row.append(place_module(p, facing=d))

    # Arrays class 2: if / Switch in 2D, then in 3D.
    # Sheet 2: one possible facade pattern
    for j in range(rows):
        for i in range(cols):
            angle = turn if (i + j) % 2 else 0   # if / Switch
            place_panel(i * dx, j * dy, angle)

    # Pattern example: a brick wall, every other course shifted half a brick
    for k in range(courses):
        shift = (k % 2) * brick / 2               # 0, 1, 0, 1 ... a rule on the index
        for i in range(count):
            t = i / (count - 1)
            p, d = point_on(curve, t), direction_on(curve, t)
            place_brick(p + d * shift + (0, 0, k * height), facing=d)

    # Sheet 3: the same rules in 3D. A rule picks one of two values for a parameter
    for k in range(layers):
        for j in range(rows):
            for i in range(cols):
                checker = (i + j + k) % 2 == 0          # a 3D checkerboard
                size = big if checker else small        # Switch: two options, one parameter
                turn = 45 if k % 2 else 0               # the layer index drives rotation
                place_cube(i * dx, j * dy, k * dz, size, turn)
  teaching_note: Teach this unit in two classes. Class 1 and its loop tutorial cover explicit repetition,
    nested loops, indices and counts in 1D, 2D and 3D, then bend the row onto a curve (Part 1 scene 04) —
    repetition only. Class 2's brick wall (Part 2 scene 08) is the first pattern, where k modulo 2 shifts every other course. The loop pseudocode above is the written tutorial;
    its Blender recording is linked on the lesson page. Class 2 covers if/Switch in 2D, then the same rules in 3D using the layer index. The Sine curve scene in Arrays Part 2 is optional practice; Sheet 3 is graded on 3D conditional patterns in which the rule switches a parameter between two values.
    Distinguish explicit iteration from Blender fields and Grasshopper data trees. A field is not a Repeat Zone.
- id: U05
  title: Attractor
  url_slug: attractors
  vocabulary:
  - distance
  - external condition
  - field
  - remap
  - clamp
  - falloff
  - nearest
  goal: "Measure the distance to points and curves, see it as a grey field, and
    use it to vary geometry."
  steps:
  - "Measure the distance to one point. Show it as a grey image before you
    change any geometry."
  - "Set input and output ranges; rescale the distance (remap), limit it (clamp)
    and choose how quickly its effect fades (falloff)."
  - Compare distance to one point, the nearest of several points and the nearest location on a curve.
  - "For the façade, measure the distance from each panel to one curve and to
    one or two points. Rescale each influence, combine them, and use the result
    to drive one panel dimension. Compare a uniform façade with two attractor
    setups, and show an elevation and an isometric of the same final façade."
  exercise: "3.3: measure the distance to a curve and to points → rescale and
    combine their influence → use the result to drive one panel parameter. Use
    one curve and one or two point attractors together. Show an elevation and an
    isometric with the combined field and a legend. In 4.1 you carry the same
    measuring into layered site analysis for the final project."
  connection: "The façade completes Project 3. Site analysis starts Project 4
    and feeds the volume exploration, contouring and laser-cut model. That
    analysis has its own class, where you apply attractor measurements to the
    prepared point cloud with supplied groups; it is taught with U07."
  pseudocode: |
    # One curve and a list containing one or two point attractors.
    # remap maps the stated distance range to an influence from 1 to 0.
    for p in panel_locations:
        d_curve = distance(p, closest_point(curve, p))
        influences = [clamp(remap(d_curve, curve_range, (1, 0)), 0, 1)]
        for attractor in point_attractors:
            d_point = distance(p, attractor)
            influences.append(clamp(remap(d_point, point_range, (1, 0)), 0, 1))
        combined = clamp(mean(influences), 0, 1)  # one possible combination
        value = panel_min + combined * (panel_max - panel_min)
        panel = build_panel(shape_parameter=value)
        place(panel, p)
- id: U07
  title: Volumetric Data and Fields
  url_slug: point-clouds-and-the-transition-to-volumes
  vocabulary:
  - sample
  - point cloud
  - origin
  - units
  - decimation
  - density
  - voxel
  - radius
  - scalar field
  - implicit surface
  - signed distance field
  - isosurface
  - threshold
  - noise
  - resolution
  goal: "Use supplied groups to read spatial data and explore generative
    volumes."
  steps:
  - "Open the prepared point cloud and note its source, units and orientation.
    Use the supplied analysis groups to make two meaningful layers and state one
    design observation."
  - "See how points, density, signed distance and an extracted boundary differ.
    You need to explain what the supplied groups take in and produce — not
    rebuild how they work inside."
  - "Use the supplied volume groups to explore one strategy, such as
    noise-driven form. Change the scale, the threshold or another meaningful
    control, and save three settings."
  - "Choose one result for contouring and fabrication. Resolution and Boolean
    operations on volumes are shown as useful tools; you don't submit a separate
    comparison of them."
  exercise: "4.1: two analysis layers and one design observation on one sheet.
    4.2: three settings of a generative volume, one chosen isometric and its key
    parameters on one sheet. Use the supplied groups and explain your design
    choices."
  connection: "Next, Discretizing Geometry turns your chosen volume into ordered
    contours and physical parts."
  pseudocode: |
    cloud = load("site.ply")
    print(len(cloud))                          # state this before

    cloud = decimate(cloud, keep=0.05)
    print(len(cloud))                          # and after

    for p in cloud:
        p.density = len(within(cloud, p, radius))

    volume = voxelize(cloud, size=0.5)

    # A designed field can also define a volume.
    def field(p):                              # a shape as a function
        a = sphere_sdf(p, center_a, r_a)
        b = box_sdf(p, center_b, size_b)
        return smooth_min(a, b, k)             # the blend comes free

    grid    = sample(field, bounds, resolution)
    surface = extract(grid, iso=0.0)           # where the field is zero
  teaching_note: A noise-modified implicit field is not automatically an exact signed distance field. Explain
    this distinction through the supplied groups. The pseudocode describes their conceptual role, not code
    students must reconstruct. Prepare and test the dataset and node groups before these assignments begin.
- id: U09
  title: Discretizing Geometry
  url_slug: contour-sections-and-physical-parts
  vocabulary:
  - section plane
  - contour
  - interval
  - discretization
  - thickness
  - registration
  - kerf
  - nesting
  goal: "Use contours and sections to turn a volume into parts you can
    fabricate."
  steps:
  - "Use the supplied contouring group to slice your volume and put the
    resulting curves in order."
  - "Choose one slicing direction and spacing that suit the form, the material
    thickness and the model scale. Alternatives are shown in class; there is no
    minimum number of slices and no comparison sheet to submit."
  - "Close and clean the profiles you want; turn them into parts with the
    material's thickness and a clear way to line them up (registration)."
  - "Test the fit and the kerf, then number, nest and cut the parts, and
    document the assembly."
  exercise: "Compare the continuous volume, its ordered contours and the
    assembled parts. Explain what is lost and gained along the way."
  connection: "The volume you choose in 4.2 becomes the ordered parts of 4.3 and
    the laser-cut model of 4.4. Build one fabrication sheet across both stages;
    printed parts are optional."
  pseudocode: |
    sections = []
    for k in range(count):
        z = z0 + k * interval
        sections.append(slice(volume, z))      # ordered, and order matters

    for i, s in enumerate(sections):
        s = offset(s, kerf / 2)                # the blade has width
        label(s, i)
        nest(s, sheet)
  teaching_note: Designed section parts are distinct from the layers a printer slicer generates. Decide which
    curves are part boundaries before assigning thickness or sending machine files.
- id: U10
  title: Final
  url_slug: final
  vocabulary:
  - fabrication
  - fit
  - assembly
  - documentation
  - revision
  goal: "Assemble and document one laser-cut model, make your chosen revisions
    and complete the final booklet."
  steps:
  - Test material, fit and connections before full production.
  - "Fabricate and assemble the selected parts within your confirmed lab
    allocation."
  - "Add photographs and observations to the fabrication sheet you started in
    4.3; you don't need a separate model sheet."
  - "After critique, make your chosen revisions. Reuse the sheets that worked
    and your Graphic Standards Manual; finish the booklet you have built through
    the semester and check all files."
  exercise: Bring a fabrication test, a documented revision and a booklet spread for review.
  connection: Submit the booklet, revised manual, editable files and required fabrication work at the final
    review. Follow the BOOK and 4.4 briefs.

