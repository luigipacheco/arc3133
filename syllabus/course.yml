    due_time: '23:59'
- id: P2
  title: CSG
  units:
  - U02
  description: Explain a CSG object through a BIG-style process diagram with instructions, then 3D print it.
  brief_title: CSG - Sheet and Print
  brief_pdf: files/assignments/P2-CSG-Sheet-and-Print.pdf
  brief_milestones:
  - P2a
  - P2b
  milestones:
  - id: P2a
    title: CSG process and instructions
    kind: visual
    release: 2
    due: 6
    weight: 10
    requirements:
    - 'One 17 × 11 inch sheet laid out as a BIG-style process diagram (in the manner of Bjarke Ingels Group''s
      step-by-step massing diagrams): six to nine numbered frames, according to the actual operation sequence,
      with one clear operation or operation type per frame.'
    - Use white building masses, color to identify operations or changes, clear outlines and a simple line-weight
      hierarchy. Use lighter or dashed lines for hidden edges where needed. Keep the viewpoint consistent;
      introduce context and vegetation in the final frame. Follow your Graphic Standards Manual.
    - Use at least three primitives; include translation, rotation and scale, plus union and difference.
      Intersection is demonstrated in class and optional in the assignment. Label the kept solid and cutter
      in each subtraction.
    - Draw the final solid at building scale with a 1.75 m figure, vegetation, ground and shadow.
    - Add clear instructions and matching pseudocode beside the diagrams, one step per operation, with the
      exposed parameters.
    - Refer to Di Mari and Yoo's Operative Design and Di Mari's Conditional Design; name the spatial operation
      your sequence explores.
    - Submit an editable graph with exposed inputs and all source operations intact.
    deliverable: One 17 x 11 inch diagram sheet with matching instructions (pseudocode); PDF and editable graph.
    brief:
      description: 'Build an editable CSG object and explain its construction as a sequence another person
        can follow. Use a BIG-style massing diagram: one operation per frame, a consistent viewpoint and a
        visible change between steps. Present one diagram sequence and one matching set of instructions
        (pseudocode) on the same 17 x 11 inch sheet, then make one 3D printed object in P2b.'
      parameters:
      - Expose primitive dimensions, translation values, rotation angle/axis/center and scale factor. Name
        inputs by their geometric role and state units.
      - Define the origin and axes, where each primitive starts, and the order of Boolean operands. In a difference,
        identify the solid kept and the cutter removed.
      - Keep the source operations editable. Preserve native node names and use Frames/groups to explain the
        sequence. Use Blender Geometry Nodes or an already approved Rhino/Grasshopper route.
      studies:
      - '**Six to nine numbered frames.** Begin with at least three primitive solids. Include translation,
        rotation, scale, union and difference; intersection is optional. Mark incoming geometry and removed material so
        the change can be read without guessing. Each frame records one operation or operation type, with its
        relevant values.'
      - '**Matching instructions (pseudocode).** Place one instruction beside each frame. Identify objects
        by primitive type, position or step number; add consistent names when the sequence becomes complex
        enough to need them. State units and coordinate conventions once, then specify enough dimensions,
        translations and other transforms to reconstruct the result. Naming every intermediate solid is optional.'
      - '**BIG-style graphic language.** Keep building masses white and use your palette to highlight added,
        removed or transformed geometry. Use strong outer outlines, lighter secondary edges and dashed hidden
        edges where useful. Study the [diagram tutorial](https://www.youtube.com/watch?v=8Y5Rn3bDL5s), also
        listed in Resources. Reserve vegetation and other context for the final frame.'
      - '**Final solid at building scale.** Show the final geometry with a 1.75 m figure, vegetation, ground
        and shadow. Separate presentation context from the CSG object that will be fabricated. State the spatial
        operation explored, with a reference to Operative Design or Conditional Design.'
      workflow:
      - Choose a spatial operation from the readings, sketch a sequence and build it from primitives using
        an editable graph.
      - Check the Boolean order and change an exposed input. Verify that the downstream result recomputes without
        rebuilding the graph.
      - Write the procedure from the working model. Ask a partner to identify any undefined size, position
        or operand; revise those instructions.
      - Export the operation views from one camera and compose the single sheet using the Graphic Standards
        Manual. Match every frame to the current graph.
      deliverables:
      - '**One 17 x 11 inch landscape PDF sheet:** `Lastname_Firstname_P2a.pdf`. Include all numbered frames,
        adjacent instructions/pseudocode, exposed values, the final architectural view and source credits.'
      - '**Editable graph:** `.blend`, or `.gh` plus `.3dm` where used. Internalize Grasshopper reference inputs;
        package any other necessary dependencies. A baked mesh or screenshots alone cannot demonstrate the
        operation history.'
      - Use `Lastname_Firstname_P2a/` for the submission. Keep the object available for the separate P2b fabrication
        milestone.
      evaluation:
      - '**Computational understanding - 30%:** explain the transforms, Boolean operands and operation order;
        demonstrate how an exposed input changes the result.'
      - '**Visual communication - 30%:** diagram and pseudocode agree; consistent views explain each change
        and the final spatial result using the Graphic Standards Manual.'
      - '**Technical execution - 25%:** required operations remain editable; dimensions, axes, operands and
        instructions allow reconstruction; the submission files are complete.'
      - '**Exploration - 15%:** purposeful parameter tests and the chosen operation sequence support the
        intended spatial effect.'
      checklist:
      - Six to nine frames; at least three primitives; translation, rotation, scale, union and difference.
        Intersection is optional.
      - Difference frames label the kept solid and cutter.
      - Instructions and pseudocode match the graph and include parameter values.
      - Final view includes a 1.75 m figure, vegetation, ground and shadow.
      - One sheet and an editable source that opens with all dependencies.
    number: '2.1'
    due_time: '23:59'
  - id: P2b
    title: CSG 3D printed object
    kind: fabrication
    release: 3
    due: 8
    checkpoints:
    - week: 6
      text: Check geometry, units, orientation and the sliced preview before queueing.
    weight: 5
    requirements:
    - Print a variant of your CSG object from P2a, within 60 mm on each axis and the 200 g allocation, without
      supports.
    - Hand in the physical print during class on the listed due date; submit digital files and brief fabrication
      notes by 11:59 PM Eastern Time that night. No additional presentation sheet is required.
    - Plan how to avoid support material through orientation, separating the object into parts for assembly,
      or adjusting overhangs. Bridging is allowed when it prints successfully on the selected printer.
    - Submit the editable source, exported mesh and slicer project. Explain any geometry changes made for printability.
    deliverable: One 3D printed CSG object, assembled if printed in parts; source, mesh, slicer files and brief fabrication notes.
    brief:
      description: Fabricate a variant of your P2a CSG object and explain the decisions that make it printable.
        Compare the final physical object with the digital geometry. Record any revision for closure, feature
        thickness or orientation so the fabrication copy remains traceable to the original construction.
      parameters:
      - Uniform print scale and final X/Y/Z dimensions in millimeters. Each axis must be no greater than 60
        mm for the final assembled object; confirm each part also fits within 60 mm on each axis for printing.
      - Printer/material profile, draft layer height, wall count and infill. Supports must be off. Record the
        chosen values rather than assuming a universal printer profile.
      - Orientation, bed-contact face, estimated time and filament use. The total allocation is 200 g including
        failed attempts.
      studies:
      - '**Geometry check.** Show the final fabrication mesh as a closed solid with consistent outward normals.
        Resolve open edges, internal faces and self-intersections before slicing.'
      - '**Orientation comparison.** Compare two positions on the bed. Label contact areas, overhangs, bridges
        and unsupported islands; explain the chosen orientation. Separate the object into parts and assemble
        after printing, or adjust overhangs where needed. Bridging is acceptable if it works with the chosen
        printer and material; check the sliced preview and test uncertain spans.'
      - '**Sliced and physical result.** Inspect the layer preview for missing thin features and floating starts.
        Record dimensions, settings, predicted time/material and a photograph of the completed object. Explain
        one difference between the prediction and the print.'
      workflow:
      - Duplicate/export the P2a result for fabrication while keeping its source graph intact. Record changes
        made to the geometry.
      - Export the mesh in millimeters and confirm all three dimensions in the slicer; STL itself does not
        store units. Scale uniformly to preserve proportions.
      - Complete the geometry/orientation/slicing check before entering the queue. Follow current FabLab orientation
        and machine procedures.
      - Print with supports off, keep a record of material used including failed attempts, and photograph the
        final object, assembling printed parts if needed. Include brief notes explaining your support-free strategy.
      deliverables:
      - '**One physical CSG object**, assembled if printed in parts, within 60 x 60 x 60 mm, produced without
        supports and within the 200 g allocation. Bring it to class on the listed due date with your name on a separate label.'
      - '**Brief fabrication notes and a photograph** in the submission folder. Record your support-free strategy,
        orientation choice, any part separation/assembly or geometry changes, dimensions and slicer settings/time/material.
        The 2.1 diagram sheet remains the single CSG presentation sheet; no second sheet is required.'
      - '**Editable source, exported mesh and slicer project** in `Lastname_Firstname_P2b/`. Include a screenshot
        showing dimensions and supports off. A preview or render does not replace the physical object.'
      evaluation:
      - '**Preparation and fabrication strategy - 30%:** mesh, orientation, part division and sliced layers
        support a viable print within the size, material and support constraints.'
      - '**Fabrication quality - 30%:** the completed object retains the intended geometry, with sound
        features, controlled finish and accurate assembly where printed in parts.'
      - '**Visual documentation - 25%:** clear photographs and notes follow the Graphic Standards Manual;
        the source, mesh, slicer project and physical result correspond.'
      - '**Testing and revision - 15%:** orientation comparisons, layer checks and any print tests inform
        decisions; explain what worked and any changes made.'
      checklist:
      - Each dimension is at most 60 mm; supports are off; cumulative filament use is at most 200 g.
      - Mesh closure, normals, thin features and layer preview have been checked.
      - Brief fabrication notes include the support-free strategy, orientation reasoning, settings and a photograph.
      - Physical object, source, mesh and slicer project are ready for submission.
    number: '2.2'
    due_time: '23:59'
- id: P3
  title: Paneling
  units:
  - U03
  - U04
  - U05
  description: Build a panel from descriptive geometry, repeat it in 1D/2D/3D arrays, then drive one panel
    parameter with an attractor to compose a façade.
  brief_title: Paneling, Arrays and Attractor Façade
  brief_pdf: files/assignments/P3-Paneling-and-Arrays.pdf
  brief_milestones:
  - P3a
  - P3b
  - P3c
  milestones:
  - id: P3a
    title: Descriptive geometry module — material and three-point lighting
    kind: visual
    release: 4
    due: 9
    weight: 10
    requirements:
    - Choose a simple panel from a built precedent that tiles edge to edge in a 2 × 2 grid. Credit the building,
      architect and source.
    - Define parameters first and explain each. Include a shape control such as aperture, fold depth or corner
      offset, beyond overall dimensions.
    - Build an editable, closed mesh from explicit point and face lists. Calculate point positions from the
      parameters.
    - For a panel with 24 or more points, a Boolean operator is allowed if at least 16 explicit points are
      used to generate geometry. Review this approach with your professor.
    - State the ranges where the module closes and tiles. Diagram low, middle and high values of a shape parameter.
    - Use one 17 x 11 inch sheet showing three rendered panel variations with different parameter values.
      Apply one student-authored module material and one consistent lighting strategy across all three.
      Use three-point lighting (key, fill and rim/back), a neutral ground plane and no entourage.
    - Beside the renders, show the point list, face list referencing those points and a parameter table
      with the values used for each variation. No separate face-winding explanation or lighting diagram is required.
    - Study the [three-point lighting tutorial](https://www.youtube.com/watch?v=RDbrOpnIY7Q), also listed in
      Resources. Three-point lighting describes lighting roles; it does not require Point-type lights.
    deliverable: One 17 x 11 inch sheet with three panel variations, point and face lists, and a parameter table; PDF and editable graph.
    brief:
      description: Construct a panel from a built precedent using explicit point positions and ordered faces.
        Present three parameter variations on one 17 x 11 inch sheet, using one material and one consistent
        three-point lighting setup on a ground plane. Include the point list, face list and parameter table.
        This authored module is reused on Sheets 1–2 of 3.2 and becomes the
        parameter-driven element in 3.3.
      parameters:
      - Width, depth and height/thickness in stated model units, with a local origin and X/Y/Z axes.
      - 'At least one shape control beyond overall size: aperture, fold depth, corner offset or an equivalent
        geometric feature. Identify the control and list the values used for the three variations.'
      - Valid ranges and dependencies for every control. State the limits within which faces remain valid,
        the solid closes and neighboring panels meet.
      studies:
      - '**Precedent and construction lists.** Credit the building, architect and image source. Show the point
        list with indices and coordinates, and the face list referencing those point indices. For the permitted
        Boolean route, identify the geometry generated from at least 16 explicit points and review it with your professor.'
      - '**Three parameter settings.** Render low, middle and high values of a shape parameter using the same
        graph. Include a parameter table with the values for all three variations. Check closure and edge-to-edge
        2 x 2 tiling in the working model; additional construction or tiling diagrams are not required on the sheet.'
      - '**One material and lighting strategy.** Use the same student-authored module material and lighting
        setup in all three renders. The key light establishes form, the fill controls shadow contrast and the
        rim/back light separates edges from the background. Keep the module on a neutral ground plane. Follow
        the [three-point lighting tutorial](https://www.youtube.com/watch?v=RDbrOpnIY7Q). No lighting diagram is required.'
      workflow:
      - Select a built panel with a repeatable boundary and identify its points, edges and faces.
      - Define inputs, calculate vertices and assemble ordered face lists. Review any permitted Boolean
        use with your professor under the 24-point/16-explicit-point rule above.
      - Test closure, normals and tiling at low/middle/high settings. Resolve gaps, reversed faces and intersections.
      - Create one module material and balance the key/fill/rim lights on a ground-plane scene. Render
        all three variations consistently; compose the sheet with the point list, face list and parameter table.
      deliverables:
      - '**One 17 x 11 inch landscape module sheet:** `Lastname_Firstname_P3a.pdf`. Include the credited precedent,
        three rendered panel variations, a point list, a face list referencing those points and a parameter
        table for the three settings. Use one module material and one lighting strategy throughout.'
      - '**Editable graph/source:** `.blend`, or an already approved `.gh`/`.3dm` route. Include the material/light
        scene used for the render and package referenced assets. Keep native node names visible and explain
        your groups with Frames.'
      - Submit files in `Lastname_Firstname_P3a/`. Save the chosen parameter setting and panel origin so the
        exact same module can be reused in P3b. No physical print is required for this milestone.
      evaluation:
      - '**Computational understanding - 30%:** explain how the parameters, point list and face list
        construct the panel and how a shape input changes it.'
      - '**Visual communication - 30%:** the three renders, material, lighting, lists and parameter table
        reveal the geometry clearly and follow the Graphic Standards Manual.'
      - '**Technical execution - 25%:** the panel is valid, tiles in the working model and meets the
        explicit-point/Boolean rules; the editable scene reproduces the submitted views.'
      - '**Exploration - 15%:** three meaningful parameter settings test the shape control and support
        the selected module for later assignments.'
      checklist:
      - Built precedent credited; panel authored from calculated points and ordered faces.
      - One shape control beyond dimensions, tested at low/middle/high values.
      - Closure, normals and edge-to-edge 2 x 2 tiling checked in the working model.
      - One sheet shows three rendered variations, the point list, face list and parameter table.
      - Any Boolean use is reviewed with the professor, for a panel with 24 or more points and at least
        16 explicit points used to generate geometry.
      - One student-authored module material and one key/fill/rim lighting strategy across all variations;
        neutral ground plane; no entourage. No lighting diagram or material-settings table is required.
    number: '3.1'
    due_time: '23:59'
  - id: P3b
    title: Arrays
    kind: visual
    release: 6
    due: 10
    weight: 10
    requirements:
    - Submit exactly three 17 x 11 inch landscape sheets together as one assignment.
    - 'Sheet 1 — four diagrams: your 3.1 module alone, your module in a 1D array, your module in a 2D array,
      and your module in a 3D array. Use the same module and label counts, spacing and axes.'
    - 'Sheet 2 — four façade-pattern diagrams: use your module in a 2D array and if/Switch conditions to
      generate four different patterns. Each diagram must identify its condition and resulting modification.'
    - 'Sheet 3 — volumetric exploration: use cubes in a 3D array and present an isometric view. Drive vertical
      variation with a mathematical function of both X and Y, such as sine or cosine. Explore the resulting
      spatial form; optionally combine it with Switch conditions to generate voids.'
    - Reuse the 3.1 panel definition on Sheets 1–2. Sheet 2 may transform or omit selected instances to make
      a pattern. Use cubes, rather than the panel, for the volumetric exercise on Sheet 3.
    - Present simple diagrams using one consistent view and material for comparable studies. Keep lighting
      consistent; separate polished render setups for the four façade patterns are not required. Choose an
      appropriate view for each dimensional array and use isometric for the cube volume.
    - Build repetition from basic nodes and begin with a count you can inspect; there is no minimum element
      count.
    - Use materials from the instructor-provided library or create your own. Record which materials you used
      and any edits; package required textures. Material choice must keep array spacing, depth and repetition
      readable. The library will be posted before this assignment is due; creating your own remains an equally
      valid route.
    deliverable: Three sheets — module and basic arrays, four conditional façade patterns, and a mathematical cube volume; one PDF and editable graph.
    brief:
      description: Develop basic panel arrays, four conditional façade patterns and an exploratory cube
        volume shaped by math. Present the three sheets using your Graphic Standards Manual.
      parameters:
      - Integer counts Nx, Ny, Nz; positive spacing dx, dy, dz measured between module origins; base point
        and array axes. Use one module orientation for Sheet 1.
      - Each façade condition, its true/false outcomes and relevant controls, such as row interval, rotation,
        displacement or keep/remove choice.
      - Cube size, layer count, height function and its final settings, including amplitude, frequency and
        phase where used. Identify any optional void rule.
      - Material source and any edits. Library or student-authored materials are permitted; package textures.
      studies:
      - '**Sheet 1 - Module and dimensional repetition.** Show the module, row, grid and spatial array.
        Label counts, spacing, axes and totals Nx, Nx*Ny and Nx*Ny*Nz. Make the 3D layers visible within
        that diagram.'
      - '**Sheet 2 - Four conditional façade patterns.** Explore four distinct patterns using if/Switch.
        Possible rules include alternating rows or columns, checkerboards and diagonal bands. Rotate, move,
        scale or omit selected instances. Label each condition and its true/false outcomes.'
      - '**Sheet 3 - Math shapes a cube volume.** Explore a 3D array of cubes, using the Sine curve scene in
        the Arrays Part 2 example file as a reference. One possible
        relationship is `f(x,y) = A*sin(fx*x + px) + B*cos(fy*y + py)` with layer positions
        `z = k*dz + f(x,y)`. Here k is the layer index; angles are in radians. Retain multiple layers.
        Explore the settings and select one result for the isometric. Switch-based voids are optional.'
      workflow:
      - Reference your 3.1 module. Build a row, then nested 2D and 3D arrays from basic nodes; check their counts.
      - Develop four façade patterns from the 2D array. Verify that each condition affects the intended instances.
      - Build a separate layered cube array. Explore functions of X and Y, optionally add voids, and save
        the settings of your selected result.
      - Check for unintended collisions and duplicate positions. Compose the three sheets with readable
        views, rule captions and materials.
      deliverables:
      - '**Exactly three 17 x 11 inch landscape sheets in one PDF:** `Lastname_Firstname_P3b.pdf`. They are one
        assignment, submitted together.'
      - '**Sheet 1 - Four diagrams.** Your module alone, then the same module in a 1D, 2D and 3D array.
        Label axes, counts, spacing and array totals.'
      - '**Sheet 2 - Four façade patterns.** Four diagrams using your module in a 2D array, modified by
        if/Switch conditions. Include a short condition and outcome caption for each pattern.'
      - '**Sheet 3 - Cube volume.** One isometric view of an exploratory 3D cube array with vertical variation
        driven by a function of X and Y. Include the formula and final settings; describe any optional rule
        used to create voids.'
      - '**Editable graph/source** in `Lastname_Firstname_P3b/`, with labeled inputs, saved settings and
        outputs for all three sheets. Package dependencies, textures and a material-source note. No physical print is required.'
      evaluation:
      - '**Computational understanding - 30%:** explain dimensional repetition, if/Switch conditions and
        the function of X and Y; demonstrate how their controls change the outputs.'
      - '**Visual communication - 30%:** the three sheets reveal repetition, façade patterns and the cube
        volume; captions and diagrams follow the Graphic Standards Manual.'
      - '**Technical execution - 25%:** array totals agree, conditions affect the intended instances and
        saved inputs reproduce every output; Sheets 1–2 use the panel and Sheet 3 uses layered cubes.'
      - '**Exploration - 15%:** four distinct façade patterns and purposeful function tests support the
        selected spatial result. Conditional voids remain optional.'
      checklist:
      - Sheet 1 has exactly four diagrams showing the 3.1 module alone and in 1D, 2D and 3D arrays.
      - Axes, counts, spacing and totals are labeled for the basic arrays.
      - Sheet 2 has four different façade patterns using the module, each with an if/Switch rule and outcomes.
      - Sheet 3 shows an isometric cube volume, with multiple layers and vertical variation driven by X and Y.
      - The height function and selected values are recorded; any optional void rule is identified.
      - Three sheets submitted together; the source reopens and reproduces all documented outputs.
      - Material library selections or student-authored materials identified; referenced textures packaged.
    number: '3.2'
    due_time: '23:59'
  - id: P3c
    title: Attractor-driven panel façade
    kind: visual
    release: 11
    due: 13
    checkpoints:
    - week: 12
      text: Bring a uniform façade, the sampled attractor field, and a first test of one driven panel parameter.
    weight: 10
    requirements:
    - Use your 3.1 panel and the 2D array logic from 3.2 to build a façade. Sample distance to a point or curve
      attractor at each panel location.
    - Use the attractor data to drive exactly one geometric parameter of the panel, such as aperture, fold
      depth or corner offset. Recompute panel geometry from that parameter. Color alone or moving unchanged
      panels does not satisfy this requirement.
    - Diagram distance measurement, normalization/remapping, clamping and the chosen parameter range. Keep
      all other panel geometry inputs fixed for the comparison. Stay inside the valid range tested in 3.1.
    - Compare a uniform baseline with the attractor-driven façade. Show one additional attractor position using
      the same graph and parameter mapping.
    - Present one 17 x 11 inch composition with an orthographic façade elevation and a matching isometric view
      of the same final façade. Make the attractor location/curve and its influence readable in an overlay
      or accompanying field diagram with a legend.
    - Submit a print-ready PDF and the editable graph. These are views of a 3D panel system; a standalone 2D
      line-field drawing is no longer the assignment. Pen plotting is not required.
    deliverable: 'One façade composition: elevation, isometric, attractor/parameter diagram and controlled
      comparisons; PDF and editable graph.'
    number: '3.3'
    due_time: '23:59'
    brief:
      description: Turn your panel array into a responsive façade. Measure an attractor field across the façade
        and use its values to change one geometric parameter in the panel you built in 3.1. The elevation explains
        the overall composition; the isometric explains the three-dimensional result.
      parameters:
      - Façade row/column counts, panel spacing and base plane/origin. Use a stable grid so the comparison
        isolates changes to panel form.
      - Attractor point position or curve, measured-distance input range, remapping/falloff and clamping.
      - One selected geometric panel parameter, its units and minimum/maximum values. Keep the other shape
        parameters fixed; test validity at both extremes.
      studies:
      - '**Baseline.** Show a small uniform façade with the selected panel parameter fixed. Label the constant
        value.'
      - '**Field to form.** Diagram sample location → distance → normalized/clamped value → panel parameter.
        Show the field and legend beside the geometry so the relationship is traceable.'
      - '**Controlled variation.** Move the attractor once and compare the result while keeping the grid, range
        and remaining inputs unchanged. Do not rebuild the graph for each study.'
      - '**Final composition.** Give the elevation and matching isometric the most space. Show the attractor
        explicitly and label the selected parameter, limits and final settings. Use the Graphic Standards Manual.'
      workflow:
      - Reference your own panel definition and create a small façade grid. Confirm the uniform baseline first.
      - Measure distance at each panel location. Map and clamp the values into the chosen panel parameter range,
        then generate the individual panels.
      - Check the near and far limits and several intermediate panels. Resolve gaps, self-intersections or
        invalid faces before increasing the array count.
      - Capture the two attractor settings and compose the elevation, isometric and explanatory diagrams from
        the saved final state.
      deliverables:
      - '**One 17 x 11 inch landscape PDF:** `Lastname_Firstname_P3c.pdf`. Include the final façade elevation
        and isometric, the attractor/field legend, the mapping diagram, the baseline and one additional attractor
        setting.'
      - '**Editable source** in `Lastname_Firstname_P3c/`: save the panel definition, array, attractor and
        named mapping controls; internalize or package all dependencies and materials. Record the settings
        used for the final views.'
      - Prepare the composition for normal printing at its stated size. No pen-plotter output or physical façade
        model is required.
      evaluation:
      - '**Computational understanding - 30%:** explain how the measured field maps to one panel geometry
        parameter and demonstrate its response to a moved attractor.'
      - '**Visual communication - 30%:** elevation, isometric, field legend and captions explain the façade
        composition and follow the Graphic Standards Manual.'
      - '**Technical execution - 25%:** the 3.1 panel and 3.2 array remain valid across the mapped range;
        packaged source and saved settings reproduce the final views.'
      - '**Exploration - 15%:** baseline and changed-attractor studies isolate the control''s effect and
        support the selected composition.'
      checklist:
      - Own panel and array reused; one geometric panel parameter responds to the attractor.
      - Input/output ranges, units, clamping and attractor position are documented.
      - Uniform baseline and one additional attractor setting are shown.
      - Final elevation and isometric show the same façade; field influence is legible.
      - Print-ready composition and packaged source reproduce the final result.
- id: P4
  title: Integrated Spatial Project
  units:
  - U05
  - U07
  - U09
  - U10
  description: Use supplied analysis, volume and contouring node groups to develop one project from a site
    observation through generative volume studies to a laser-cut assembly.
  milestones:
  - id: P4a
    title: Site analysis using attractors
    kind: visual
    release: 12
    due: 14
    weight: 5
    deliverable: One 17 x 11 inch site-analysis sheet with two analytical layers and one design observation;
      PDF, working file and source record.
    checkpoints:
    - week: 13
      text: Bring the prepared dataset or an approved alternative, source/units, and two analytical layers
        with legends.
    requirements:
    - Use the instructor-prepared point-cloud dataset and supplied analysis groups. An approved student-sourced
      dataset is also welcome. Record source, units, scale and orientation.
    - Make two meaningful analytical layers, such as distance to a point or curve and height bands. Select
      inputs and ranges that reveal a spatial relationship; explain what each layer measures.
    - Submit one 17 x 11 inch sheet showing both layers with legends and one design observation that will
      inform 4.2–4.4. A separate combined visualization is optional.
    - Save the working file and identify the supplied groups, their inputs, outputs and role. You are assessed
      on your interpretation and use of the tools, not on rebuilding their internal algorithms.
    number: '4.1'
    due_time: '23:59'
  - id: P4b
    title: SDF volumetric exploration
    kind: visual
    release: 13
    due: final
    checkpoints:
    - week: 14
      text: 'Ungraded production check: bring three generative settings, a selected volume in isometric and
        its intended model scale before contouring.'
    weight: 10
    requirements:
    - Use the supplied SDF/volume groups to explore one generative strategy informed by the observation from
      4.1. For example, use a noise texture to drive a volume and vary its scale or threshold.
    - Show three settings of the same strategy, with key parameter values. Select one of these results and
      explain the spatial qualities that make it worth fabricating. Boolean comparisons are optional.
    - Submit one 17 x 11 inch sheet with the three variations, a larger isometric of the selected result,
      key parameters and a short explanation connecting the site observation to your choices. No elevation
      or abstract floor plan is required.
    - Communicate solid/void, depth and spatial relationships using the Graphic Standards Manual. The Resources
      visual precedents may guide composition; credit any references used.
    - Retain the editable file and selected volume for contouring and fabrication. Explain the supplied groups'
      inputs, outputs and purpose; rebuilding their internal SDF algorithms is not required. A noise-driven
      volume is not necessarily an exact signed distance field.
    deliverable: One 17 x 11 inch sheet with three generative variations, the selected isometric and key
      parameters; PDF and editable volume source.
    number: '4.2'
  - id: P4c
    number: '4.3'
    title: Discretizing the SDF
    kind: visual
    release: 14
    due: final
    weight: 10
    checkpoints:
    - week: 15
      text: 'Ungraded production check: bring numbered contours, a cutting layout, an assembly diagram and
        a small material/registration test.'
    requirements:
    - Use the supplied contouring group on the selected 4.2 volume. Choose one slicing direction and spacing;
      explain how these translate the form into buildable parts.
    - Let model scale, material thickness and intended spacing determine the number of slices. There is no
      fixed minimum slice count. Keep parts ordered and numbered.
    - Use a simple assembly strategy such as glued layers, rods or registration guides. Printed connectors
      are optional. Test a representative part or connection before cutting the full set.
    - Prepare one 17 x 11 inch fabrication sheet with the chosen direction/spacing, a numbered cutting layout,
      an assembly diagram and brief test notes. A reduced layout belongs on the sheet; submit the full-size
      cutting file separately. Reserve space for the final photographs added in 4.4.
    - Check units, scale, material thickness, kerf and lab-confirmed stock. Export clean cutting curves and
      retain the editable file. Explain the supplied group's inputs and outputs; rebuilding it is not required.
    deliverable: One 17 x 11 inch fabrication sheet, continued in 4.4; PDF, editable source and full-size
      numbered cutting file.
  - id: P4d
    number: '4.4'
    title: Laser-cut model and documentation
    kind: fabrication
    release: 14
    due: final
    weight: 10
    checkpoints:
    - week: 15
      text: 'Ungraded fabrication check: show a tested sample, assembly strategy, cutting progress and a
        remaining-work plan.'
    requirements:
    - Fabricate and assemble the contoured project from 4.1–4.3 on the laser cutter. A laser-cut assembly is
      sufficient; printed connectors or other printed components are optional.
    - Use the numbered parts and simple assembly strategy from 4.3. Test material, kerf and registration
      before the full batch; revise files as needed. Glue, rods or registration guides are acceptable.
    - Keep the assembled model within 300 mm on each axis and the laser-cut parts within one confirmed sheet.
      Confirm stock, sheet dimensions and machine access with the instructors/FabLab. Confirm any optional
      printing allocation separately before printing.
    - Submit the physical model and add an overall photograph, an assembly detail and brief observations to
      the same 17 x 11 inch fabrication sheet begun in 4.3. No additional presentation sheet is required.
    - Include the editable source, final cutting file, a material/part list and photographs; include printable
      meshes and slicer files only if you chose to print components. Credit supplied assets.
    - Assessment focuses on fabrication and assembly quality, fidelity to the selected form and learning
      from tests. The cutting strategy is assessed in 4.3; the shared sheet is not graded twice for its layout.
    deliverable: One assembled laser-cut model and the completed 4.3 fabrication sheet with photographs;
      source, cutting file and material/part list. Print files only if used.
  url_slug: volumetric-data

