    - "Include the editable file, the final cutting file, a list of materials
      and parts, and photographs; include printable meshes and slicer files only
      if you printed parts. Credit supplied files and tools."
    - "Grading focuses on the quality of the fabrication and assembly, how
      faithful it is to the chosen form, and what you learned from tests. The
      cutting strategy is graded in 4.3, so the shared sheet's layout is not
