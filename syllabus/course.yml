    - Focus on a convincing envelope and architectural visualization. Detailed services, full retail planning and
      construction documentation are outside this exercise. Keep the form suitable for contour fabrication.
    deliverable: 'One 17 x 11 inch sheet: plan, section, isometric, use/scale and design explanation; editable envelope.'
    number: '4.2'
    brief:
      description: Select a result from 4.1 and fine-tune its field into a compelling architectural envelope for
        a small pavilion or shop. Instructor-provided SDF Boolean operators are available to assist design development.
      learn:
      - Make architectural judgments about scale, enclosure, openings, occupied space and ground connection.
      - Refine a generative result into one coherent proposal rather than collecting more unrelated variations.
      - Understand how supplied SDF Boolean operations can combine or carve volumes to support architectural intentions.
      - Use plan, section and isometric together to explain space and architectural intent.
      deliverables:
      - '**Presentation:** one 17 x 11 inch landscape sheet, `Lastname_Firstname_P4b.pdf`, due November 10.'
      - '**Three drawings:** one plan, one section and one isometric of the same pavilion or small-shop envelope.
        Indicate the section cut on the plan; use clear drawing labels and scale information.'
      - '**Architectural information:** state the intended use; identify the selected 4.1 result; show entrance/access,
        usable space, openings and the relationship to the ground. Include a person and key dimensions demonstrating
        the maximum 12 x 12 x 12 m envelope.'
      - '**Design explanation:** briefly name the field controls and any supplied SDF Boolean operations used to
        develop the architecture. No additional Boolean comparison sheet is required.'
      - '**Editable model:** retain the chosen field settings and any Boolean operations, with supplied groups credited
        and assets packaged in `Lastname_Firstname_P4b/`. Check that all three drawings come from this model and
        that it is ready for contouring.'
      evaluation:
      - Architectural clarity, quality of spatial refinement, consistent drawings and an understandable connection
        between the field controls, any Boolean operations used and design decisions.
      - 'Course weight 15%. Digital rubric: understanding 30%, communication 30%, technical execution 25%, exploration
        15%.'
    due_time: '23:59'
  - id: P4c
    number: '4.3'
    title: Contour model - registration and assembly
    kind: fabrication
    release: 12
    due: 13
    weight: 10
    requirements:
    - Use the supplied contouring tools on the 4.2 envelope. Choose one slicing direction and spacing appropriate
      to the material and form; there is no fixed minimum contour count.
    - 'Use 1:50 as the starting model scale: a 12 m envelope becomes 24 cm. Keep the completed model within the
      existing 30 cm limit on each axis; review another scale with your professor.'
    - Number the parts and include a registration mark or feature that establishes their alignment. Hold the model
      using glue, rods, tabs, spacers, a jig or another simple tested method.
    - Test a small group of parts before the full cut. Check material thickness, kerf, alignment and how the assembly
      preserves openings and spatial qualities.
    - Prepare clean full-size cutting curves and a layout within one lab-confirmed sheet of material. Confirm stock
      and machine access; optional printed components need their own allocation.
    deliverable: One assembled contour model; one 17 x 11 inch fabrication sheet; separate full-size cutting file,
      editable source, part list and photographs.
    brief:
      description: Translate the same pavilion or shop envelope into contour parts and assemble a physical model
        that preserves its important spaces and openings.
      learn:
      - Relate model scale, material thickness and contour spacing.
      - Use registration marks or alignment features to place parts accurately.
      - Test, revise and document a fabrication and assembly strategy.
      deliverables:
      - '**Physical submission:** bring one assembled contour model of your 4.2 design to class on November 17.
        Use 1:50 as the starting scale and stay within 30 cm on each axis.'
      - '**Presentation:** one 17 x 11 inch landscape fabrication sheet, `Lastname_Firstname_P4c.pdf`, due November
        17 at 11:59 PM Eastern Time.'
      - '**On the sheet:** chosen model scale, material/thickness, contour direction and spacing; a reduced numbered
        cutting layout; a registration/assembly diagram; short test-and-revision notes; one overall model photograph
        and one assembly/alignment detail.'
      - '**Cutting file:** supply the full-size cutting curves separately in the FabLab-accepted format, with units
        and part numbers. The reduced layout on the PDF is not the machine file.'
      - '**Supporting files:** editable model/contouring source, material and part list, and original photographs
        in `Lastname_Firstname_P4c/`. Include print/slicer files only if printed components were used.'
      - '**Check:** part numbers agree across files and model, the registration method aligns the parts, the test
        informed the final cut, and the assembled model corresponds to the plan, section and isometric in 4.2.'
      evaluation:
      - Preparation and fabrication strategy 30%; fabrication quality 30%; visual documentation 25%; testing and
        revision 15%.
      - Course weight 10%. Assess the parts, alignment, assembly and what the test improved, as well as fidelity
        to the architectural proposal.
    due_time: '23:59'
