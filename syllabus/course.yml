  date: '2026-10-06'
  focus: "Use Compare and Switch to select between façade patterns — a brick wall with every other course shifted is the first example — then apply the same rules in 3D, using the layer index as well as rows and columns. Start from small examples; hexagonal and radial arrays and math-shaped volumes are optional. The Rhino + Grasshopper videos are posted; the Blender Arrays part 2 video is not out yet. No graded submission this week (studio reviews)."
