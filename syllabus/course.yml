      - "**Testing and revision - 15%:** orientation comparisons, layer checks
        and any test prints inform your decisions; explain what worked and what
        you changed."
      checklist:
      - "Each dimension is at most 60 mm; supports are off; total filament used,
        failed prints included, is at most 200 g."
      - "You have checked that the mesh is closed, its normals face outward,
