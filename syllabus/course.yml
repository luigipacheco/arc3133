    milestones:
      - id: P2a
        title: CSG process and instructions
        kind: visual
        release: 2
        due: 4
        weight: 7
        requirements:
          - 'One 17 × 11 inch sheet laid out as a BIG-style process diagram (in the manner of Bjarke Ingels Group''s step-by-step massing diagrams): eight or nine numbered frames, one operation per frame, read in sequence.'
          - Use at least three primitives; include translation, rotation and scale, plus union, difference and intersection. Label the kept and removed solids in each subtraction.
          - Draw the final solid at building scale with a 1.75 m figure, vegetation, ground and shadow.
          - Add clear instructions and matching pseudocode beside the diagrams, one step per operation, with the exposed parameters.
          - Refer to Di Mari and Yoo's Operative Design and Di Mari's Conditional Design; name the spatial operation your sequence explores.
          - Submit an editable graph with exposed inputs and all source operations intact.
        deliverable: One process sheet; PDF and editable graph.
      - id: P2b
        title: CSG 3D printed object
        kind: fabrication
        release: 3
        due: 10
        checkpoints:
          - week: 6
            text: Check geometry, units, orientation and the sliced preview before queueing.
        weight: 7
        requirements:
          - Print a variant of your CSG object from P2a, within 60 mm on each axis and the 200 g allocation, without supports.
          - Hand in the print in Week 10 with one process sheet showing orientation and a photograph.
          - Submit the editable source, exported mesh and slicer project. Explain any geometry changes made for printability.
        deliverable: One 3D printed CSG object and one process sheet; source, mesh and slicer files.
  - id: P3
    title: Paneling
    units:
      - U03
      - U04
      - U05
    description: Build a module, array it across two sheets, plot an attractor field and analyze a site with the Mixtli add-on.
    milestones:
      - id: P3a
        title: Descriptive geometry module — material and lighting
        kind: visual
        release: 4
        due: 6
        weight: 7
        requirements:
          - Choose a simple panel from a built precedent that tiles edge to edge in a 2 × 2 grid. Credit the building, architect and source.
          - Define parameters first and explain each. Include a shape control such as aperture, fold depth or corner offset, beyond overall dimensions.
          - Build an editable, closed mesh from explicit point and face lists. Calculate point positions from the parameters.
          - State the ranges where the module closes and tiles. Diagram low, middle and high values of a shape parameter.
          - Use one 17 × 11 inch sheet with one studio render of the module on a ground plane — one material, a deliberate lighting setup (key, fill and rim, or one sun and sky) and no entourage. Record the material and light settings on the sheet.
          - Beside the render, show point and face lists, a parameter table and the vertex order of one face. Explain normals, closure and reversed face winding.
        deliverable: One module presentation sheet; PDF and editable graph.
      - id: P3b
        title: Arrays
        kind: visual
        release: 6
        due: 8
        weight: 7
        requirements:
          - 'Array your P3a module across exactly two 17 × 11 inch sheets, submitted together as one assignment.'
          - 'Sheet 1 — 1D, 2D and 3D arrays: a linear array, a nested grid and an XYZ cube array. Label count, spacing and index order; show the predicted total for each.'
          - 'Sheet 2 — hexagonal, radial and curve arrays: a staggered hexagonal grid, a radial array (radius, count, angular step) and an array along a curve, including one sine-driven curve with amplitude, frequency and phase labelled.'
          - Keep the module unchanged; vary only its placement. Expose count and spacing or radius in the graph.
          - Build repetition from basic nodes and begin with a count you can inspect; there is no minimum element count.
          - Include one conditional selection on either sheet. State its rule (for example, indices 3–5 lift by 0.5) and show the array before and after it applies.
        deliverable: Exactly two sheets submitted together as one assignment; PDF and editable graph.
      - id: P3c
        title: 'Attractor: 2D field drawing'
        kind: visual
        release: 8
        due: 10
        checkpoints:
          - week: 9
            text: Bring the grayscale field and a first line drawing of it.
        weight: 7
        requirements:
          - Build a 2D attractor field on a flat grid and translate it into lines — vary line length, rotation, spacing or hatch density with the measured distance.
          - Compare single-point, multiple-point and curve attractors on the same grid, with the same mapping, so the difference comes from the attractor alone.
          - Make one 17 × 11 inch sheet presenting the line drawing, with the grayscale field and a legend beside it. Label input and output ranges, clamping and falloff.
          - Keep the drawing as clean vector lines and submit the SVG with the sheet PDF and the editable graph.
          - Optional — plot the drawing on the pen plotter and add a photograph or scan of the plot to the sheet.
        deliverable: One sheet presenting a 2D attractor field drawing; PDF, SVG and editable graph. A physical plot is optional.
      - id: P3d
        title: 'Attractor: layered site analysis'
        kind: visual
        release: 9
        due: 11
        weight: 7
        deliverable: One site-analysis sheet; PDF, working file and a source record for the site.
        checkpoints:
          - week: 10
            text: Bring your site's point cloud and at least two mapped layers with legends.
        requirements:
          - Pick a site you can document and state why you chose it. Record the source of the point cloud, its units, scale and orientation.
          - Map at least three layers of the point-cloud data with attractor logic — for example distance to points or curves, height bands, and a recorded attribute such as colour or classification.
          - Make one 17 × 11 inch sheet with small views of each layer, each with its own legend and units, beside one larger combined visualization.
          - Explain what each layer measures, how you combined them, and what the combined view shows about the site.
          - Record the tool, inputs and ranges for every layer and submit the working file. The Mixtli add-on for Blender, introduced in class, does these operations; an equivalent tool is fine.
  - id: P4
    title: Volumetric Data
    units:
      - U07
      - U09
      - U10
    description: Model a volume with signed distance fields, discretize it into slices and fabricate a laser-cut assembly.
    milestones:
      - id: P4a
        title: SDF volume
        kind: visual
        release: 10
        due: 12
        checkpoints:
          - week: 11
            text: Bring an SDF diagram, a union/intersection/difference comparison and a candidate volume for slicing.
        weight: 14
        requirements:
          - Use two 17 x 11 inch sheets to explain a volume built from signed distance fields (SDF) — the CSG logic from P2, applied to fields instead of meshes.
          - Compare union, intersection and difference using the same source fields. Show the chosen result and three controlled parameter variants.
          - Diagram the field logic and identify density, signed distance or another implicit function. State sampling resolution and surface extraction settings.
          - Select one volume for P4b and explain the spatial intention. Submit the editable graph and retain the source fields.
        deliverable: Two volume-study sheets; PDF and editable field graph.
      - id: P4b
        title: Discretizing and laser-cut fabrication
        kind: fabrication
        release: 12
        due: final
        checkpoints:
          - week: 13
            text: Review section directions, thickness, registration, fit/kerf test and cutting layout before production.
          - week: 15
            text: Review the assembled result, photographs and final booklet documentation.
        weight: 14
        requirements:
          - Use the selected P4a volume. Compare two section directions or intervals, then develop at least 12 ordered slices with material thickness and a registration system.
          - Fit the assembly within 300 mm on each axis and one confirmed material sheet. Test kerf and fit before the batch; label and nest every part.
          - Laser-cut and assemble the slices under FabLab procedures. Include test cuts and failed parts in the material allocation.
          - Present the assembly with one 17 x 11 inch process sheet showing the continuous volume, section sequence, cutting layout, assembly diagram and photographs.
          - Submit the editable source, cutting file and documentation. Regenerate fabrication files after any geometry or material change.
        deliverable: Laser-cut slice assembly and one process sheet; source, cutting file and photographs.
assessments:
  - id: BOOK
    title: Final booklet and review
    release: 1
    due: final
    weight: 18
    checkpoints:
      - week: 12
        text: Bring a booklet spread and contents list for an ungraded progress check.
    requirements:
      - Compile all four projects and nine assignments in revised form, using 17 x 11 inch pages and your graphic standards.
      - Include process diagrams, photographs and captions for the CSG print and laser-cut volume. Identify substantive revisions after critique.
      - Submit the booklet PDF, a separate revised GSM PDF, editable project files and dependencies, and required fabrication files.
      - Present the laser-cut assembly and the CSG print or its review documentation as directed. The exact final review slot remains to be confirmed.
  - id: PART
    title: Attendance and participation
    release: 1
    due: ongoing
    weight: 5
    requirements:
      - Participate in demonstrations, working sessions and critique and bring the current editable file.
      - Attendance and absence terms are stated in the retained course policies.
weeks:
  - week: 1
    date: '2026-08-25'
    focus: Begin the Graphic Standards Manual, test a sample sheet and organize your files.
  - week: 2
    label: Transformations and Booleans
    date: '2026-09-01'
    focus: Move, rotate and scale procedurally. Compare solid Boolean operators and begin the massing study.
  - week: 3
    label: 3D printing
    date: '2026-09-08'
    focus: 'Refine the CSG process sheet and instructions. Introduce P2b: prepare the CSG object for 3D printing, including units, orientation and slicing.'
  - week: 4
    label: Point to solid
    date: '2026-09-15'
    focus: Point → Line → Edge → Face → Solid → Boolean. Build the parametric pyramid and reconnect to the CSG project.
  - week: 5
    label: Your module, material and lighting
    date: '2026-09-22'
    focus: Build your own module from points and faces, test its parameter ranges, then render it with one material and a deliberate lighting setup for the P3a sheet.
  - week: 6
    label: 1D, 2D and 3D arrays
    date: '2026-09-29'
    focus: '1D, 2D and 3D arrays: linear, nested grid and XYZ cube array, with index order and a conditional selection. Brief P3b; start sheet 1.'
  - week: 7
    label: Hexagonal, radial and curve arrays
    date: '2026-10-06'
    focus: 'Hexagonal, radial and curve arrays, including a sine-driven curve. Start P3b sheet 2. No graded submissions during studio reviews.'
    no_due: true
  - week: 8
    label: 2D field drawing
    date: '2026-10-13'
    focus: 'Attractors on a 2D field: measure distance, show the grayscale field, remap and clamp, then translate the field into lines and export an SVG (pen plotting optional). Brief P3c.'
  - week: 9
    label: Layered site analysis
    date: '2026-10-20'
    focus: 'Layered site analysis: map a point cloud with distance, height and attribute layers and combine them into one reading, using the Mixtli add-on. Brief P3d; review P3c line drawings.'
  - week: 10
    label: Deadline week and SDF
    date: '2026-10-27'
    focus: 'Mid-semester deadline: everything through Arrays is due, with the 2D attractor drawing. Regular class: introduce Volumetric Data and signed distance fields; brief P4a.'
  - week: 11
    label: SDF volume
    date: '2026-11-03'
    focus: 'SDF volume: signed distance primitives, union/intersection/difference and smooth blends, noise and surface extraction. Brief P4a; select a volume for slicing. P3d is due.'
  - week: 12
    label: Sections
    date: '2026-11-10'
    focus: Slice the chosen volume into contours. Compare section directions, intervals and order.
  - week: 13
    label: Parts for the laser cutter
    date: '2026-11-17'
    focus: Develop section parts with thickness and registration. Test fit and kerf, then label and nest the parts.
  - week: 14
    label: Production
    date: '2026-11-24'
    focus: Begin final production and assembly. Review fabrication tests, document revisions and develop the booklet.
  - week: 15
    label: Documentation and booklet
    date: '2026-12-01'
    focus: Fabricate and assemble sections within lab availability, then documentation, booklet and file checks. No graded submissions during the retained final studio-review window.
    no_due: true
vocabulary:
  - [parameter, 'An input you can change that controls a relationship or result.', 'Width, Depth and Height on the pyramid.']
  - [vector, 'An ordered set of components representing direction and magnitude; XYZ values can also specify a position relative to an origin.', 'A displacement of (0, 0, 1) moves a point upward one model unit.']
  - [point, 'A location in space.', 'One XYZ position.']
  - [vertex, 'A mesh element with a position that edges and faces can reference.', 'A corner of the pyramid. The plural is vertices.']
  - [line or curve, 'A one-dimensional path; the example line connects two positions.', 'A curve is a different geometry component from a mesh edge.']
  - [edge, 'A connection between two mesh vertices.', 'One side of a face boundary.']
  - [face, 'A mesh surface bounded by an ordered cycle of vertices and edges.', 'One triangular side of the pyramid.']
  - [mesh, 'Vertices, edges and faces together; a mesh can be open or closed.', 'Four triangular sides plus a base make the pyramid mesh.']
  - [solid, 'A shape enclosing a volume; its mesh boundary must be closed and consistently oriented for the solid exercises.', 'The capped pyramid before Boolean subtraction.']
  - [Boolean, 'Union combines regions, intersection keeps their overlap, and difference removes one from another.', 'Cube minus pyramid.']
  - [list and index, 'An ordered collection and the position of an item in that collection.', 'Array points indexed from zero. A Blender field evaluates over geometry elements rather than exposing a general list socket.']
  - [loop, 'An operation repeated a specified number of times, potentially carrying a result into the next iteration.', 'Repeat Input and Repeat Output define a Repeat Zone.']
  - [nested loop, 'A repetition performed inside another repetition.', 'Columns generated for every row of a grid.']
  - [conditional, 'A test that chooses a value or selects which elements change.', 'Compare plus Switch; Boolean Math combines range tests.']
  - [field, 'A value evaluated at locations or elements in a stated domain.', 'Distance evaluated at every array point; later a scalar value sampled in a volume.']
  - [attractor, 'An external point, collection or curve used to measure a condition that drives a parameter.', 'Distance remapped into component height.']
  - [tessellation and lattice, 'A tessellation covers a surface with cells; a lattice organizes a connected network in space.', 'A panel surface and a node-and-strut system.']
  - [point cloud, 'A collection of spatial samples, possibly carrying attributes such as color.', 'Imported site data; preserve its source and scale.']
  - [voxel, 'A cell of a sampled three-dimensional grid.', 'Smaller cells can capture finer features at greater storage and computation cost.']
  - [signed distance field, 'A scalar field storing signed distance to a boundary, using a stated inside/outside convention.', 'The zero level defines the boundary; arbitrary density or noise is not automatically distance.']
  - [discretization, 'Representing a continuous form or function with a finite collection of samples or parts.', 'Turning a volume into ordered contour sections with material thickness.']
materials_status: |
  Posted lessons link their Blender examples and screenshots. Use each file as a reference while building your own work. Each class page links its slides. Video tutorials are posted for CSG and Descriptive Geometry, in Blender and in Rhino + Grasshopper; other topics will follow.

  **Site analysis:** students pick their own site and use the Mixtli add-on for Blender. The add-on and install notes will be posted before Week 9.
references:
  readings:
    - 'Wassily Kandinsky, Point and Line to Plane — conceptual reference for geometry and graphic relationships.'
    - 'Robert Woodbury, Elements of Parametric Design — relationships, dependencies and change.'
    - 'Casey Reas, Chandler McWilliams and LUST, Form+Code — repetition, transformation and visualization.'
    - 'Arturo Tedeschi, AAD Algorithms-Aided Design — an additional Grasshopper reference where that environment is supported.'
    - 'Diego García Cuevas and Gianluca Pugliese, Advanced 3D Printing with Grasshopper: Clay and FDM — fabrication and toolpath reference.'
    - 'Anthony Di Mari and Nora Yoo, Operative Design: A Catalog of Spatial Verbs — the CSG operations named as spatial acts; primary reference for the massing sequence.'
    - 'Anthony Di Mari, Conditional Design: An Introduction to Elemental Architecture — the companion volume; operations driven by a condition or rule.'
    - 'Neil Spiller, Drawing Architecture; Peter Cook, Drawing: The Motive Force of Architecture — architectural drawing and visual communication.'
  manuals:
    - ['NYCTA Graphics Standards Manual (1970)', 'https://archive.org/details/nycta-gs-manual', 'Massimo Vignelli and Bob Noorda, Unimark International. A binder of cases: every sign in the New York subway drawn at size with its rule beside it. Full scan.']
    - ['NASA Graphics Standards Manual (1975, NHB 1430-2)', 'https://archive.org/details/NASA_Graphics_Standards_Manual', 'Richard Danne and Bruce Blackburn. One mark, and a hundred pages of where it is allowed to go. What is designed is the consistency. Full scan, public domain.']
    - ['Munich 1972 — visual design guidelines', 'https://www.otlaicher.de/en/articles/the-rainbow-games/', 'Otl Aicher, 1967–1972. A grid, a fixed set of angles and one component varied across a whole field of pictograms. A restricted palette held for four years.']
  precedents:
    - ['@mmnksr', 'https://www.instagram.com/mmnksr/', 'Point-cloud and section imagery; compare representation choices.']
    - ['@mantissa.xyz', 'https://www.instagram.com/mantissa.xyz/', 'A second point-cloud/section reference for visual comparison.']
    - ['@saul_kim_', 'https://www.instagram.com/saul_kim_/', 'Composition, restraint and spatial legibility.']
    - ['@facadepot', 'https://www.instagram.com/facadepot/', 'Components, façades and controlled variation.']
  documentation:
    - ['Blender Repeat Zone', 'https://docs.blender.org/manual/en/5.2/modeling/geometry_nodes/utilities/repeat_zone.html', 'Explicit iteration with Repeat Input and Repeat Output.']
    - ['Blender Field to Grid', 'https://docs.blender.org/manual/en/5.2/modeling/geometry_nodes/volume/operations/field_to_grid.html', 'Sampling fields on a voxel-grid topology.']
    - ['Blender SDF Grid Offset', 'https://docs.blender.org/manual/en/5.2/modeling/geometry_nodes/volume/operations/sdf_grid_offset.html', 'Distance-based offset of an SDF surface.']
    - ['Blender 5.2 manual', 'https://docs.blender.org/manual/en/5.2/index.html', 'Check exact node behavior against the version used to prepare the lesson.']
  note: No required textbook is assigned in this draft. These references are retained or aligned from the course repository. Tutorial and file availability is stated separately.
instructor_notes: |
  The four projects are GSM, CSG, Paneling and Volumetric Data. Week 10 is the hard deadline for everything through Arrays; there is no midterm review. Paneling includes four separate assignments: the module, arrays, the 2D field drawing (due Week 10) and the layered site analysis (due Week 11). The two array sheets form one assignment; the two attractor sheets form two assignments.

  Arrays runs over two classes: 1D, 2D and 3D in Week 6; hexagonal, radial and curve in Week 7. Week 8 teaches the 2D attractor field and its line drawing, with pen plotting as an option; Week 9 teaches the layered site analysis with Mixtli. Students pick their own site for P3d and analyze it with the Mixtli add-on; post the add-on and install notes before Week 8. Confirm plotter access and run a sample plot before briefing P3c.

  Project 4 has two assignments: the SDF volume and discretizing/laser-cut fabrication. Point-cloud and noise exercises support the volume lesson but carry no separate required submission. Tessellation, lattices and modular prints are optional references.

  Draft weights use 7% per assignment in Projects 1-3 and 14% for each Project 4 assignment. The required fabricated outputs are the CSG print and the sliced volume; plotting the P3c drawing is optional. Review machine capacity and the later schedule in Week 10.

  Every class now has a deck generated from slides/src that reads dates and briefs from this file; rebuild the decks after any calendar or brief change. Video tutorials exist for CSG and Descriptive Geometry (Blender and Rhino + Grasshopper); record the others as time allows. Keep institutional policies separate from curriculum edits.
home:
  tagline: Build geometry with rules, vary it with data and communicate it through drawings, models and physical parts.
  welcome: |
    Welcome to ARC 3133. This course is about describing architecture as a set of rules — operations, points and faces, arrays and fields — and turning that description into clear drawings, renders and physical objects: a 3D print, attractor drawings and a laser-cut assembly.

    We work mainly in Blender Geometry Nodes, and the video tutorials also cover Rhino + Grasshopper. No programming experience is needed: you build with nodes, and each lesson shows the same steps written as short pseudocode so you learn to read it.
  tabs:
    - [Classes, /classes/overview/, 'One page per class, in order. Each has the slides, the video tutorials, the Blender example files, what to practice and what is due. Start here every week.']
    - [Assignments, /assignments/overview/, 'The four projects and their nine assignments — what to make, what to hand in, when it is due and how it is graded.']
    - [Tutorials, /tutorials/how-tutorials-work/, 'Lesson notes and video tutorials for each topic. Use them to review a class, catch up, or work through a step at your own pace.']
    - [Resources, /resources/overview/, 'The syllabus and course policies, software and materials, readings, visual precedents, and every example file and screenshot in one place.']
  how_we_work: |
    Each class is a short demonstration, then guided practice and critique. Bring your editable file every week: you should be able to change an input, predict what happens and explain why. Your Graphic Standards Manual sets the look of every sheet you present.

    Fabrication runs through the semester: a 3D print in Project 2 and a laser-cut assembly in Project 4, with an optional pen-plotter drawing in Project 3. Complete the FabLab Safety Orientation before using any machine.
