vocabulary:
  - [parameter, 'An input you can change that controls a relationship or result.', 'Width, Depth and Height on the pyramid.']
  - [vector, 'An ordered set of components representing direction and magnitude; XYZ values can also specify a position relative to an origin.', 'A displacement of (0, 0, 1) moves a point upward one model unit.']
  - [point, 'A location in space.', 'One XYZ position.']
  - [vertex, 'A mesh element with a position that edges and faces can reference.', 'A corner of the pyramid. The plural is vertices.']
  - [line or curve, 'A one-dimensional path; the example line connects two positions.', 'A curve is a different geometry component from a mesh edge.']
  - [edge, 'A connection between two mesh vertices.', 'One side of a face boundary.']
  - [face, 'A mesh surface bounded by an ordered cycle of vertices and edges.', 'One triangular side of the pyramid.']
  - [mesh, 'Vertices, edges and faces together; a mesh can be open or closed.', 'Four triangular sides plus a base make the pyramid mesh.']
  - [solid, 'A shape enclosing a volume; its mesh boundary must be closed and consistently oriented for the solid exercises.', 'The capped pyramid before Boolean subtraction.']
  - [Boolean, 'Union combines regions, intersection keeps their overlap, and difference removes one from another.', 'Cube minus pyramid.']
  - [list and index, 'An ordered collection and the position of an item in that collection.', 'Array points indexed from zero. A Blender field evaluates over geometry elements rather than exposing a general list socket.']
  - [loop, 'An operation repeated a specified number of times, potentially carrying a result into the next iteration.', 'Repeat Input and Repeat Output define a Repeat Zone.']
  - [nested loop, 'A repetition performed inside another repetition.', 'Columns generated for every row of a grid.']
  - [conditional, 'A test that chooses a value or selects which elements change.', 'Compare plus Switch; Boolean Math combines range tests.']
  - [field, 'A value evaluated at locations or elements in a stated domain.', 'Distance evaluated at every array point; later a scalar value sampled in a volume.']
  - [attractor, 'An external point, collection or curve used to measure a condition that drives a parameter.', 'Distance remapped into component height.']
  - [tessellation and lattice, 'A tessellation covers a surface with cells; a lattice organizes a connected network in space.', 'A panel surface and a node-and-strut system.']
  - [point cloud, 'A collection of spatial samples, possibly carrying attributes such as color.', 'Imported site data; preserve its source and scale.']
  - [voxel, 'A cell of a sampled three-dimensional grid.', 'Smaller cells can capture finer features at greater storage and computation cost.']
  - [signed distance field, 'A scalar field storing signed distance to a boundary, using a stated inside/outside convention.', 'The zero level defines the boundary; arbitrary density or noise is not automatically distance.']
  - [discretization, 'Representing a continuous form or function with a finite collection of samples or parts.', 'Turning a volume into ordered contour sections with material thickness.']
materials_status: |
  Posted lessons link their Blender examples and screenshots. Use each file as a reference while building your own work. Each class page links its slides. Video tutorials are posted for CSG and Descriptive Geometry, in Blender and in Rhino + Grasshopper; other topics will follow.

  **Site analysis:** students pick their own site and use the Mixtli add-on for Blender. The add-on and install notes will be posted before Week 9.

  The 3.2 material library is planned and has not yet been linked. Students may create their own materials. Final-project print allocation and machine slots remain to be confirmed. Revised slide decks are not yet posted; use the current briefs and lesson notes.

references:
  readings:
    - 'Wassily Kandinsky, Point and Line to Plane — conceptual reference for geometry and graphic relationships.'
    - 'Robert Woodbury, Elements of Parametric Design — relationships, dependencies and change.'
    - 'Casey Reas, Chandler McWilliams and LUST, Form+Code — repetition, transformation and visualization.'
    - 'Arturo Tedeschi, AAD Algorithms-Aided Design — an additional Grasshopper reference where that environment is supported.'
    - 'Diego García Cuevas and Gianluca Pugliese, Advanced 3D Printing with Grasshopper: Clay and FDM — fabrication and toolpath reference.'
    - 'Anthony Di Mari and Nora Yoo, Operative Design: A Catalog of Spatial Verbs — the CSG operations named as spatial acts; primary reference for the massing sequence.'
    - 'Anthony Di Mari, Conditional Design: An Introduction to Elemental Architecture — the companion volume; operations driven by a condition or rule.'
    - 'Neil Spiller, Drawing Architecture; Peter Cook, Drawing: The Motive Force of Architecture — architectural drawing and visual communication.'
  manuals:
    - ['NYCTA Graphics Standards Manual (1970)', 'https://archive.org/details/nycta-gs-manual', 'Massimo Vignelli and Bob Noorda, Unimark International. A binder of cases: every sign in the New York subway drawn at size with its rule beside it. Full scan.']
    - ['NASA Graphics Standards Manual (1975, NHB 1430-2)', 'https://archive.org/details/NASA_Graphics_Standards_Manual', 'Richard Danne and Bruce Blackburn. One mark, and a hundred pages of where it is allowed to go. What is designed is the consistency. Full scan, public domain.']
    - ['Munich 1972 — visual design guidelines', 'https://www.otlaicher.de/en/articles/the-rainbow-games/', 'Otl Aicher, 1967–1972. A grid, a fixed set of angles and one component varied across a whole field of pictograms. A restricted palette held for four years.']
  precedents:
    - ['@mmnksr', 'https://www.instagram.com/mmnksr/', 'Point-cloud and section imagery; compare representation choices.']
    - ['@mantissa.xyz', 'https://www.instagram.com/mantissa.xyz/', 'A second point-cloud/section reference for visual comparison.']
    - ['@saul_kim_', 'https://www.instagram.com/saul_kim_/', 'Composition, restraint and spatial legibility.']
    - ['@facadepot', 'https://www.instagram.com/facadepot/', 'Components, façades and controlled variation.']
  documentation:
    - ['Blender Repeat Zone', 'https://docs.blender.org/manual/en/5.2/modeling/geometry_nodes/utilities/repeat_zone.html', 'Explicit iteration with Repeat Input and Repeat Output.']
    - ['Blender Field to Grid', 'https://docs.blender.org/manual/en/5.2/modeling/geometry_nodes/volume/operations/field_to_grid.html', 'Sampling fields on a voxel-grid topology.']
    - ['Blender SDF Grid Offset', 'https://docs.blender.org/manual/en/5.2/modeling/geometry_nodes/volume/operations/sdf_grid_offset.html', 'Distance-based offset of an SDF surface.']
    - ['Blender 5.2 manual', 'https://docs.blender.org/manual/en/5.2/index.html', 'Check exact node behavior against the version used to prepare the lesson.']
  note: No required textbook is assigned in this draft. These references are retained or aligned from the course repository. Tutorial and file availability is stated separately.
instructor_notes: |
  The revised sequence contains ten assignments in four projects: 1 Manual; 2.1 CSG sheet; 2.2 CSG print; 3.1 Module; 3.2 Arrays; 3.3 Attractor façade; 4.1 Site analysis; 4.2 SDF exploration; 4.3 Discretization; 4.4 Mixed-media model. The two array sheets remain one assignment. The standalone 2D attractor drawing has been replaced by a façade elevation and isometric showing an actual panel parameter response.

  For 3.1 students create one module material, place the module on a ground plane and set up key/fill/rim three-point lighting. This describes three lighting roles, not the software's Point light type. For 3.2 students may use the supplied material library or create their own; post and verify the library before the deadline.

  Site analysis begins Project 4 and must inform the same project through SDF, discretization and mixed-media fabrication. Use the Instagram references already under Resources for 4.2 representation. Require a horizontal section for the abstract floor plan, coordinated with elevation and isometric. Both laser cutting and 3D printing belong to the final assembled model.

  The instructor accepted the draft grading allocation: early submissions stay at 7% each; site analysis moves into Project 4 at 7%, SDF remains 14%, and discretization/model split 14% into 7% each. Dates remain proposals. The final sequence is compressed: protect the November 24 volume selection and December 1 connection test, and confirm lab capacity and print allocation before issuing the full Project 4 brief.

  Detailed PDFs currently cover Projects 1–3. Project 4 has a coordinated outline; prepare its detailed handout after reviewing its scope and fabrication allocation. Existing slide decks and their generators need revision for the new sequence and numbering before reuse. Keep institutional policies and historical assets unchanged.

home:
  tagline: Build geometry with rules, vary it with data and communicate it through drawings, models and physical
    parts.
  welcome: |
    Welcome to ARC 3133. This course is about describing architecture as a set of rules — operations, points and faces, arrays and fields — and turning that description into clear drawings, renders and physical objects: a CSG print, an attractor-driven façade and a model combining laser cutting and 3D printing.

    We work mainly in Blender Geometry Nodes, and the video tutorials also cover Rhino + Grasshopper. No programming experience is needed: you build with nodes, and each lesson shows the same steps written as short pseudocode so you learn to read it.
  tabs:
  - - Classes
    - /classes/overview/
    - One page per class, in order. Each has the slides, the video tutorials, the Blender example files, what
      to practice and what is due. Start here every week.
  - - Assignments
    - /assignments/overview/
    - The four projects and their ten assignments — what to make, what to hand in, when it is due and how it
      is graded.
  - - Tutorials
    - /tutorials/how-tutorials-work/
    - Lesson notes and video tutorials for each topic. Use them to review a class, catch up, or work through
      a step at your own pace.
  - - Resources
    - /resources/overview/
    - The syllabus and course policies, software and materials, readings, visual precedents, and every example
      file and screenshot in one place.
  how_we_work: |
    Each class is a short demonstration, then guided practice and critique. Bring your editable file every week: you should be able to change an input, predict what happens and explain why. Your Graphic Standards Manual sets the look of every sheet you present.

    Fabrication runs through the semester: a 3D print in Project 2 and an integrated laser-cut/3D-printed model in Project 4. Complete the FabLab Safety Orientation before using any machine.

