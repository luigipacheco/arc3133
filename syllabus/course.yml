      parameters; PDF and editable volume source.
    number: '4.2'
  - id: P4c
    number: '4.3'
    title: Discretizing the SDF
    kind: visual
    release: 12
    due: final
    weight: 10
    checkpoints:
    - week: 13
      text: "Ungraded production check: bring numbered contours, a cutting
        layout, an assembly diagram and a small test of the material and how the
        parts line up."
    requirements:
    - "Use the supplied contouring group on the volume you chose in 4.2. Choose
      one slicing direction and spacing, and explain how they turn the form into
      parts you can build."
    - "Let the model scale, material thickness and spacing decide how many
      slices you need; there is no minimum. Keep the parts in order and
      numbered."
    - "Use a simple way to assemble it, such as glued layers, rods or alignment
      guides. Printed connectors are optional. Test a typical part or connection
      before cutting the full set."
    - "Prepare one 17 x 11 inch fabrication sheet with the chosen direction and
      spacing, a numbered cutting layout, an assembly diagram and short test
      notes. Put a reduced layout on the sheet and submit the full-size cutting
      file separately. Leave space for the final photographs you add in 4.4."
    - "Check the units, scale, material thickness, kerf and the stock the lab
      has confirmed. Export clean cutting lines and keep the editable file.
      Explain what the supplied group takes in and produces; you don't need to
      rebuild it."
    deliverable: One 17 x 11 inch fabrication sheet, continued in 4.4; PDF, editable source and full-size
      numbered cutting file.
  - id: P4d
    number: '4.4'
    title: Laser-cut model and documentation
    kind: fabrication
    release: 12
    due: final
    weight: 10
    checkpoints:
    - week: 14
      text: 'Ungraded fabrication check: show a tested sample, assembly strategy, cutting progress and a
