  label: Your module, material and lighting
  date: '2026-09-22'
  focus: "Build your own module from points and faces, test its parameter
    ranges, then render it with one material and a considered lighting setup for
    the P3a sheet."
- week: 6
  date: '2026-09-29'
  focus: "Build a loop and a nested loop — a 1D row, a 2D grid, then 3D layers — then bend the row onto a curve. Name the count, spacing and index in each direction. Check your CSG print file before queueing it."
