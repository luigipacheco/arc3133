blender:
  version: Blender 5.2.1 LTS
  version_note: Older Blender versions may not have the volume nodes used in later classes.
  reference_note: Build your own file and use examples to check individual operations. Project 4 field and contouring
    groups may be reused with credit; students still build their own matrix and develop their own envelope. The
    point-cloud file is a supplementary example, not a required assignment.
  how_to_use: Select the lesson object and press Home over the node editor to see the whole graph. Read the Frames
    in order. Change the inputs on the nodes or, where there are controls, in the GeometryNodes modifier.
  sessions:
  - id: S01
    title: Constructive Solid Geometry
    path: files/blender/01-intro-geometry-nodes/Intro-Geometry-Nodes.blend
    focus: Build the instructor's three-step CSG example from Blender's built-in primitives and rotated cylinders.
    exercise: Make three versions, changing one parameter at a time. Diagram the Intersection, Union and Difference
      in the order you used them.
    scenes:
    - 01 - CSG example
    note: The instructor's graph uses Intersection, rotated cylinders, Union and Difference. Read the Frames in
      order. Change Radius, Size, Translation, Rotation or Scale on the nodes themselves; these controls are not
      in the modifier.
  - id: S02
    title: Descriptive Geometry
    path: files/blender/02-geometry-fundamentals/GEOMETRY101-class-ready.blend
    focus: Build geometry from coordinates, then use the pyramid you control with parameters to cut a cube (Boolean).
    exercise: Show a point, a line, an edge, a face, a solid pyramid and a cube with the pyramid cut out. Keep Width,
      Depth and Height exposed, and include a mesh with several faces.
    scenes:
    - Point
    - Line
    - Edge
    - Face
    - Solid
    - Boolean
    note: Follow the six main teaching scenes; the original reference scenes are still in the file. The pyramid
      keeps Width, Depth and Height exposed, and the file ends with the cube minus the pyramid. This lesson works
      in model units; nothing is exported for fabrication.
  - id: S03
    title: 'Arrays — Part 1: line, grid, cube, curve'
    path: files/blender/03-arrays-lists/Arrays-Lists-Session-1.blend
    focus: Start with a row of copies, grow it into a grid and a cube, then bend the row onto a curve.
    exercise: Repeat the geometry along a line and across a grid, then stack the grid in layers. Bend the row onto
      a curve. In each direction, name the count, the spacing and the index.
    scenes:
    - Linear loop
    - Nested grid
    - 3D array
    - Along a curve
  - id: S04
    title: 'Arrays — Part 2: arrangements and rules'
    path: files/blender/03-arrays-lists/Arrays-Lists-Session-2.blend
    focus: Start with the simple 3D cube array, then compare hexagonal and radial arrangements and select copies
      by index. End with the Sine curve scene to show how math can shape a volume.
    exercise: Briefly review the XYZ array. Then build the brick wall (every other course shifted), use if/Switch
      to make façade patterns, and apply the same rules to a 3D array of cubes using the layer index. Hexagonal
      and radial arrangements and the Sine curve volume are optional.
    scenes:
    - 3D array
    - Hexagonal array
    - Radial array
    - If and range
    - Sine curve
    - Brick wall
    note: 'The simple 3D array comes first: a row repeated into a grid, and the grid into layers, with Count, Spacing
      and Cube Size exposed. The last scene, Sine curve, uses math on X and Y and repetition in three directions
      to shape a volume of cubes. It points ahead to the density and signed-distance lessons while still using cubes.'
  - id: S05
    title: Attractor
    path: files/blender/04-attractors/Attractors.blend
    focus: Vary parameters with the distance to one point, several points and a curve.
    exercise: Compare all three kinds of attractor on the same array, and show how moving an attractor changes the
      result.
    scenes:
    - Read the field
    - One point
    - Multiple points
    - Curve attractor
    - Panel prefab
    - One point opening
    - Multiple point openings
    - Curve openings
    note: Eight prepared checkpoints teach one lesson. First read distance and scale; then feed the same values into
      a reusable panel's Opening input. The three opening studies keep outer dimensions and thickness fixed.
      Built-in node names are unchanged; Frames explain the steps. Students replace the supplied demonstration
      panel with their own module. The full node-by-node guide is on the Attractor tutorial page and inside the file
      as START HERE - Attractors.
  - id: S07
    title: Volumetric Data and Fields — point clouds
    path: files/blender/06-point-clouds-volumes/Point-Clouds-and-Volumes.blend
    focus: Import points, measure how they relate to an attractor, and turn the samples into a volume.
    exercise: Show the imported samples, an analysis based on an attractor and the resulting volume at two resolutions.
    scenes:
    - Import points
    - Analyze points
    - Points to volume
    extras:
    - - Teaching point cloud
      - files/blender/06-point-clouds-volumes/teaching-courtyard.ply
    - - Dataset source and units
      - files/blender/06-point-clouds-volumes/teaching-courtyard.json
    note: 'Keep the data folder together: the file reads teaching-courtyard.ply from the same folder. It is a made-up
      point cloud for teaching, not a site survey.'
  - id: S08
    title: Volumetric Data and Fields — signed distance and Booleans
    path: files/blender/07-advanced-volumes/Advanced-Volumes-Session-1.blend
    focus: Read signed distance values and compare Boolean combinations of volumes.
    exercise: Compare the union, intersection and difference of the same two volumes, and explain where the surface
      sits (the zero boundary).
    scenes:
    - Mesh to SDF
    - Signed distance
    - SDF Boolean
  - id: S09
    title: Volumetric Data and Fields — noise and surface extraction
    path: files/blender/07-advanced-volumes/Advanced-Volumes-Session-2.blend
    focus: Use noise to shape a volume and extract its surface.
    exercise: Make two controlled noise variations and compare two resolutions. Choose one volume for the contour
      sessions.
    scenes:
    - Noise field
  - id: S10
    title: Discretizing Geometry — contours
    path: files/blender/08-discretizing-geometry/Discretizing-Geometry-Session-1.blend
    focus: Slice the chosen form into contour curves, in order.
    exercise: Compare two slice spacings or directions, and show how the curves describe the continuous form.
    scenes:
    - One contour
    - Contour stack
  - id: S11
    title: Discretizing Geometry — section parts
    path: files/blender/08-discretizing-geometry/Discretizing-Geometry-Session-2.blend
    focus: Turn the section profiles into numbered physical parts and a cutting layout.
    exercise: Give the parts the material thickness, test how they line up (registration) and lay out a small set
      of parts for a fit test.
    scenes:
    - Section parts
    - Laid out parts
  - id: S12
    title: Final — fabrication and assembly
    path: files/blender/09-final-project/Final-Project-Fabrication.blend
    focus: Fabricate, test and revise the system you chose, then add its documentation to the booklet.
    exercise: Make one fabrication test, document the change it calls for, and prepare the digital files, photographs
      and diagrams for the final booklet.
    scenes:
    - Print orientation
    - Fit coupon
    - Modular print
    - Registered sections
    - Cutting layout
    - Spacer rings
    extras:
    - - Fabrication notes and dimensions
      - files/blender/09-final-project/FABRICATION-NOTES.md
    - - Small print STL
      - files/blender/09-final-project/small-print-mm.stl
    - - Fit coupon STL
      - files/blender/09-final-project/fit-coupon-mm.stl
    - - Modular parts STL
      - files/blender/09-final-project/modular-parts-mm.stl
    - - Section parts and spacers SVG
      - files/blender/09-final-project/section-parts-and-spacers-mm.svg
    note: The exported files are snapshots of the default settings, in millimetres. Export them again after any
      edit, and test the physical fit before production. The modular parts are an optional reference. The required
      physical outputs are the CSG print (P2b) and the laser-cut volume (P4b).

