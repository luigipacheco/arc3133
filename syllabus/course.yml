        and coordinates, and the face list that refers to those numbers. If you
        use the permitted Boolean route, show which geometry comes from at least
        16 points you wrote out, and review it with your professor."
      - "**Three parameter settings.** Render low, middle and high values of one
        shape parameter from the same graph. Include a table of the values for
        all three. Check in your working file that the panel is closed and tiles
        edge to edge in a 2 x 2 grid; you don't need extra construction or
        tiling diagrams on the sheet."
      - "**One material and lighting setup.** Use the same material and lighting
        in all three renders. The key light shows the form, the fill controls
        how dark the shadows are, and the rim/back light separates the edges
        from the background. Keep the module on a neutral ground plane. Follow
        the [three-point lighting
        tutorial](https://www.youtube.com/watch?v=RDbrOpnIY7Q). No lighting
        diagram is needed."
      workflow:
      - "Choose a panel from a real building with a repeatable outline, and
        identify its points, edges and faces."
      - "Define the inputs, calculate the vertices and list the faces in order.
        Check any Boolean use with your professor under the 24-point / 16-point
        rule above."
      - "Test closure, normals and tiling at low, middle and high settings. Fix
        gaps, flipped faces and intersections."
      - "Make one material for the module and balance the key, fill and rim
        lights in a scene with a ground plane. Render all three versions the
        same way, then lay out the sheet with the point list, face list and
        parameter table."
      deliverables:
      - '**One 17 x 11 inch landscape module sheet:** `Lastname_Firstname_P3a.pdf`. Include the credited precedent,
        three rendered panel variations, a point list, a face list referencing those points and a parameter
        table for the three settings. Use one module material and one lighting strategy throughout.'
      - "**Editable graph:** `.blend`, or an already approved `.gh`/`.3dm`
        route. Include the material and lighting scene used for the renders, and
        pack any files it uses. Keep native node names visible and explain your
        groups with Frames."
      - "Submit your files in `Lastname_Firstname_P3a/`. Save the chosen
        parameter settings and panel origin so you can reuse exactly the same
        module in P3b. No print is required for this assignment."
      evaluation:
      - "**Computational understanding - 30%:** explain how the parameters,
        point list and face list build the panel, and how a shape input changes
        it."
      - '**Visual communication - 30%:** the three renders, material, lighting, lists and parameter table
        reveal the geometry clearly and follow the Graphic Standards Manual.'
      - "**Technical execution - 25%:** the panel is valid, tiles in the working
        file and follows the point/Boolean rule; the editable scene reproduces
        the submitted views."
      - '**Exploration - 15%:** three meaningful parameter settings test the shape control and support
        the selected module for later assignments.'
      checklist:
      - "Real building credited; panel built from calculated points and faces in
        order."
      - "One shape control beyond overall size, tested at low, middle and high
        values."
      - "Closure, normals and edge-to-edge 2 x 2 tiling checked in the working
        file."
      - One sheet shows three rendered variations, the point list, face list and parameter table.
      - "Any Boolean use has been reviewed with the professor — only for a panel
        with 24 or more points, with at least 16 written-out points generating
        the geometry."
      - "One module material you made and one key/fill/rim lighting setup across
        all versions; neutral ground plane; no entourage. No lighting diagram or
        material-settings table is needed."
    number: '3.1'
    due_time: '23:59'
  - id: P3b
    title: Arrays
    kind: visual
    release: 6
    due: 9
    due_date: '2026-10-18'
    weight: 10
    requirements:
    - Submit exactly three 17 x 11 inch landscape sheets together as one assignment.
    - "Sheet 1 — four diagrams: your 3.1 module alone, then in a 1D, a 2D and a
      3D array. Use the same module throughout, and label the counts, spacing
      and axes."
    - "Sheet 2 — four façade-pattern diagrams: apply if/Switch rules to a 2D
      array of your module to make four different patterns. Each diagram names
      its rule and what it changes."
    - "Sheet 3 — 3D conditional patterns: make a 3D array of cubes and use if/Switch rules on its row, column and layer index to drive a parameter — the rule chooses one of two values, such as large or small, 0° or 45°, low or raised: one value when true, the other when false. Make two different patterns, each shown in isometric from the same view. At least one rule must use the layer index, and at least one must switch a parameter value rather than only keep or remove cubes. A height function of X and Y is optional."
    - "Reuse the 3.1 panel on Sheets 1–2. On Sheet 2 you may change or remove
      selected copies to make a pattern. Use cubes, not the panel, on Sheet 3."
    - "Keep the diagrams simple, with the same view and material wherever
      studies are compared. Keep the lighting consistent; the four façade
      patterns don't need separate polished renders. Choose a suitable view for
      each array, and use isometric for the 3D patterns."
    - "Build the repetition from basic nodes, starting with a count small enough
      to check by eye; there is no minimum number of copies."
    - "Make every array fully parametric: expose row, column and layer counts
      and spacing in each used direction. Changing those inputs must rebuild
      the array and resize the panel or cube to fit its new cell without manual
      remodeling or repositioning. Preserve the intended gaps or edge contact."
    - "Use materials from the library the instructors provide, or make your own.
      Note which materials you used and any changes; pack any textures.
      Materials must keep the spacing, depth and repetition of the array
      readable. The library will be posted before this assignment is due; making
      your own is equally fine."
    deliverable: Three sheets — module and basic arrays, four conditional façade patterns, and two conditional 3D patterns; one PDF and editable graph.
    brief:
      description: "Build basic arrays of your panel, four façade patterns made with rules, and two 3D patterns made with the same rules in an array of cubes. Present the three
        sheets using your Graphic Standards Manual."
      parameters:
      - "Whole-number counts Nx, Ny, Nz; positive spacings dx, dy, dz, measured
        between module origins; a base point and array axes. Link module width,
        depth and any relevant height to the cell dimensions so the geometry
        adapts when spacing changes. Use one module orientation on Sheet 1."
      - "For each façade rule: what happens when it is true and when it is
        false, and its controls — for example, which rows, a rotation, a move,
        or keep/remove."
      - "Cube size; counts and spacing in X, Y and Z; and for each 3D rule, which index it reads (row i, column j or layer k), which parameter it drives, and that parameter's value when the rule is true and when it is false. Record the settings of any optional height function."
      - "Where each material comes from and any changes you made. Library or
        your own materials are both fine; pack textures."
      studies:
      - "**Sheet 1 - Module and repetition.** Show the module, a row, a grid and
        a 3D array. Label the counts, spacing, axes and totals: Nx, Nx*Ny and
        Nx*Ny*Nz. Make the layers of the 3D array visible in the diagram."
      - "**Sheet 2 - Four façade patterns.** Make four distinct patterns with
        if/Switch rules, such as alternating rows or columns, a checkerboard or
        diagonal bands. Rotate, move, scale or remove the selected copies. Label
        each rule and what happens when it is true or false."
      - "**Sheet 3 - Rules in 3D.** Make a 3D array of cubes and let if/Switch rules on the row, column and layer index drive a parameter: the rule picks one of two values, one when true and one when false. For example, a 3D checkerboard (`(i + j + k) % 2 == 0`) switches cube size between large and small; every other layer (`k % 2`) turns 45°; every third layer (`k % 3 == 0`) is raised. Removing cubes to leave voids is one more option. Make two distinct patterns — at least one reading the layer index k, and at least one switching a parameter value rather than only keeping or removing cubes — and show each in isometric from the same view. The brick wall's `k % 2` is the same idea one dimension up. A height function of X and Y (the Sine curve scene) is optional."
      workflow:
      - "Bring in your 3.1 module. Build a row, then a 2D and a 3D array from
        basic nodes, and check their counts."
      - "Test at least two count and spacing settings for each array. The
        module or cube must adapt to its cell dimensions, and copies must keep
        their intended fit or gap without manually editing their geometry."
      - "Make four façade patterns from the 2D array. Check that each rule
        changes the copies you intended."
      - "Build a separate 3D array of cubes. Write rules on i, j and k that switch a parameter between two values, test them at a small count you can check by eye, and save the settings of the two patterns you choose."
      - "Check for copies that overlap or sit in the same place by mistake. Lay
        out the three sheets with readable views, a caption for each rule, and
        your materials."
      deliverables:
      - '**Exactly three 17 x 11 inch landscape sheets in one PDF:** `Lastname_Firstname_P3b.pdf`. They are one
        assignment, submitted together.'
      - '**Sheet 1 - Four diagrams.** Your module alone, then the same module in a 1D, 2D and 3D array.
        Label axes, counts, spacing and array totals.'
      - "**Sheet 2 - Four façade patterns.** Four diagrams of your module in a
        2D array, changed by if/Switch rules. Add a short caption to each
        pattern: the rule and what it does."
      - "**Sheet 3 - Two 3D patterns.** Two isometric views, from the same view, of a 3D array of cubes changed by if/Switch rules on the row, column and layer index. Caption each with its rule, the parameter it drives, and its value when true and when false; at least one rule uses the layer index."
      - "**Editable graph** in `Lastname_Firstname_P3b/`, with labeled inputs,
        saved settings and outputs for all three sheets. An instructor must be
        able to change counts and spacing and see the arrays and modules update
        without manual edits. Pack the files it needs and the textures, and add
        a note on where the materials come from. No print is required."
      evaluation:
      - "**Computational understanding - 30%:** explain repetition in 1D, 2D and
        3D, and your if/Switch rules in 2D and 3D, including the layer index and the parameter each rule drives; show how row,
        column and layer counts and spacing control both array size and module
        dimensions."
      - '**Visual communication - 30%:** the three sheets reveal repetition, façade patterns and the 3D patterns; captions and diagrams follow the Graphic Standards Manual.'
      - "**Technical execution - 25%:** changing counts and spacing in each
        array rebuilds the copies and adapts each panel or cube to its new cell
        without manual remodeling or repositioning. The intended fit or gap is
        preserved, totals are correct, rules affect the intended copies, and
        saved inputs reproduce every output. Sheets 1–2 use the panel and Sheet
        3 uses layered cubes."
      - "**Exploration - 15%:** four distinct façade patterns and two distinct 3D patterns, chosen from rules you actually tested. Height functions remain optional."
      checklist:
      - Sheet 1 has exactly four diagrams showing the 3.1 module alone and in 1D, 2D and 3D arrays.
      - Axes, counts, spacing and totals are labeled for the basic arrays.
      - Changing row, column and layer counts and spacing in the reopened graph updates every array and the module or cube dimensions without manual edits.
      - "Sheet 2 has four different façade patterns of your module, each with
        its if/Switch rule and what it does."
      - "Sheet 3 shows two 3D patterns in isometric from the same view; at least one rule uses the layer index and at least one switches a parameter value, not only keep/remove."
      - "Each 3D rule is captioned with the parameter it drives and its value when true and when false; any optional height function is recorded."
      - "Three sheets submitted together; the file reopens and reproduces
        everything shown."
      - "Library or self-made materials identified; textures packed."
    number: '3.2'
    due_time: '23:59'
  - id: P3c
    title: Attractor-driven panel façade
    kind: visual
    release: 9
    due: 13
    checkpoints:
    - week: 10
      text: "Bring a uniform façade and a first test in which one curve and one
        or two point attractors change one panel dimension."
    weight: 10
    requirements:
    - "Use your 3.1 panel and the 2D array from 3.2 to build a façade. Use one
      curve attractor with one or two point attractors. For each panel, measure
      the shortest distance to the curve and the distance to each point."
    - "Use the attractors to drive exactly one dimension of the panel, such as
      its opening (aperture), fold depth or corner offset, and rebuild the panel
      geometry from it. Changing only color, or only moving unchanged panels,
      does not count."
    - "Rescale (remap) the curve and point distances into influence values and
      combine them with a rule you state, such as an average or a weighted mix.
      The curve and the point attractor(s) must both contribute. Diagram how you
      combine them and limit (clamp) the result to the parameter range you
      tested in 3.1; keep the panel's other inputs fixed."
    - "Compare a uniform façade (no attractors) with the combined-attractor
      façade. Show one more version by moving one point or editing the curve,
      keeping everything else the same."
    - "Present one 17 x 11 inch composition with a façade elevation and an
      isometric of the same final façade. Show the curve, every point attractor
      and their combined influence — as an overlay or a separate diagram — with
      a legend."
    - "Submit a print-ready PDF and the editable graph. These are views of a 3D
      panel system, not a flat 2D line drawing. Pen plotting is not required."
    deliverable: 'One façade composition: elevation, isometric, attractor/parameter diagram and controlled
      comparisons; PDF and editable graph.'
    number: '3.3'
    due_time: '23:59'
    brief:
      description: "Design a façade that responds to one curve attractor and one
        or two point attractors together. Combine their influence to change one
        dimension of your 3.1 panel. Show the whole composition in elevation and
        its three-dimensional result in isometric."
      parameters:
      - "Façade row and column counts, panel spacing and base plane/origin. Keep
        the grid fixed so the comparison only shows changes in the panels."
      - "One attractor curve and one or two attractor points. Record the
        distance ranges, falloff, how you combine them and any weights; limit
        (clamp) the combined influence before it changes the panel."
      - "The one panel dimension you vary, its units and its minimum and
        maximum. Keep the other shape parameters fixed, and test that the panel
        is valid at both extremes."
      studies:
      - '**Baseline.** Show a small uniform façade with the selected panel parameter fixed. Label the constant
        value.'
      - "**From distance to form.** Diagram the chain: distances to the curve
        and points → rescaled influences → combined → limited to the panel's
        range → panel dimension. Show the combined field and the curve and point
        locations, with a clear legend."
      - "**One change at a time.** Move one point or edit the curve once. Keep
        the grid, the other attractors, the mapping and the other panel inputs
        the same, so the effect is clear."
      - "**Final composition.** Give the elevation and matching isometric the
        most space. Label the curve, all point attractors, the panel dimension
        they drive and the final settings. Use your Graphic Standards Manual."
      workflow:
      - "Bring in your own panel and make a small façade grid. Check the uniform
        version first."
      - "Measure each panel's distance to the curve and to the point(s). Rescale
        and combine their influence, limit it to the chosen range, and generate
        the panels. Check that each attractor actually changes the result."
      - "Check the nearest and farthest panels and several in between. Fix gaps,
        self-intersections or broken faces before you increase the number of
        panels."
      - "Capture the two combined-attractor versions, and lay out the elevation,
        isometric and diagrams from the saved final settings."
      deliverables:
      - '**One 17 x 11 inch landscape PDF:** `Lastname_Firstname_P3c.pdf`. Include the final façade elevation
        and isometric, the curve and point locations, combined-field legend, mapping diagram, baseline and
        one changed-attractor configuration.'
      - "**Editable file** in `Lastname_Firstname_P3c/`: save the panel, array,
        curve, point(s), combination and mapping controls; pack all files and
        materials it uses. Record the settings for the final views."
      - "Set up the composition to print normally at its stated size. No
        pen-plotter output or physical façade model is required."
      evaluation:
      - "**Computational understanding - 30%:** explain how the curve and point
        influences combine to change one panel dimension, and show what happens
        when you move a point or edit the curve."
      - '**Visual communication - 30%:** elevation, isometric, field legend and captions explain the façade
        composition and follow the Graphic Standards Manual.'
      - "**Technical execution - 25%:** one curve and one or two point
        attractors all change the panels, which stay valid; the packed file and
        saved settings reproduce the final views."
      - "**Exploration - 15%:** the uniform and changed-attractor studies show
        clearly what each control does and support your final composition."
      checklist:
      - "Your own panel and array reused; one curve and one or two point
        attractors together change one panel dimension."
      - "The curve and point locations, distance ranges, combination rule, units
        and limits are documented."
      - "The uniform version and one other attractor setting are shown."
      - "The final elevation and isometric show the same façade; the attractor
        influence is easy to read."
      - "Print-ready composition, and a packed file that reproduces the final
        result."
- id: P4
  title: Integrated Spatial Project
  approach: Generative
  units:
  - U05
  - U07
  - U09
  - U10
  description: "Generative design: use supplied analysis, volume and contouring
    tools to explore options based on something you observe on a site. Choose
    one spatial result and develop it into a laser-cut model."
  milestones:
  - id: P4a
    title: Site analysis using attractors
    kind: visual
    release: 10
    due: 14
    weight: 5
    deliverable: One 17 x 11 inch site-analysis sheet with two analytical layers and one design observation;
      PDF, working file and source record.
    checkpoints:
    - week: 11
      text: Bring the prepared dataset or an approved alternative, source/units, and two analytical layers
        with legends.
    requirements:
    - "Use the point cloud the instructors prepared and the supplied analysis
      groups — or your own dataset, if approved. Record its source, units, scale
      and orientation."
    - "Make two meaningful analysis layers, such as distance to a point or
      curve, and height bands. Choose inputs and ranges that reveal a spatial
      relationship, and explain what each layer measures."
    - Submit one 17 x 11 inch sheet showing both layers with legends and one design observation that will
      inform 4.2–4.4. A separate combined visualization is optional.
    - "Save the working file and name the supplied groups: what goes in, what
      comes out, and what each is for. You are graded on how you read and use
      the tools, not on rebuilding how they work inside."
    number: '4.1'
    due_time: '23:59'
  - id: P4b
    title: SDF volumetric exploration
    kind: visual
    release: 11
    due: final
    checkpoints:
    - week: 12
      text: "Ungraded production check: before contouring, bring three
        generative settings, your chosen volume in isometric and the scale you
        plan for the model."
    weight: 10
    requirements:
    - "Use the supplied volume (SDF) groups to explore one generative strategy
      based on your observation from 4.1 — for example, use a noise texture to
      shape a volume and vary its scale or threshold."
    - "Show three settings of the same strategy, with the key parameter values.
      Choose one and explain the spatial qualities that make it worth building.
      Boolean comparisons are optional."
    - "Submit one 17 x 11 inch sheet with the three versions, a larger isometric
      of the one you chose, its key parameters, and a short explanation linking
      your site observation to your choices. No elevation or abstract floor plan
      is required."
    - "Show solid and void, depth and spatial relationships using your Graphic
      Standards Manual. The visual precedents in Resources can guide the
      composition; credit any references you use."
    - "Keep the editable file and the chosen volume for contouring and
      fabrication. Explain what the supplied groups take in, produce and are for
      — you don't rebuild the SDF methods inside them. Note that a volume shaped
      by noise is not always an exact signed distance field."
