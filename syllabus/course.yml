  no_due: true
- week: 9
  date: '2026-10-20'
  focus: "Everything through Arrays — the manual (1), 2.1, 2.2, 3.1 and 3.2 — was due on Teams by Sunday, October 18 at 11:59 PM; your midterm grade is the accumulated grade of all five. Today: façade attractors for 3.3 — combine one curve and one or two points to drive a panel parameter, then begin the elevation and isometric composition."
