- id: P2
  title: CSG
  approach: Procedural
  units:
  - U02
  description: "Procedural design: build a CSG object through a clear sequence
    of operations. Explain the steps with a BIG-style diagram and pseudocode,
    then 3D print the result."
  brief_title: CSG - Sheet and Print
  brief_pdf: files/assignments/P2-CSG-Sheet-and-Print.pdf
  brief_milestones:
  - P2a
  - P2b
  milestones:
  - id: P2a
    title: CSG process and instructions
    kind: visual
    release: 2
    due: 9
    due_date: '2026-10-18'
    weight: 10
    requirements:
    - "One 17 × 11 inch sheet laid out as a BIG-style process diagram (like
      Bjarke Ingels Group's step-by-step massing diagrams): six to nine numbered
      frames that follow your actual sequence, with one clear operation or type
      of operation per frame."
    - Use white building masses, color to identify operations or changes, clear outlines and a simple line-weight
      hierarchy. Use lighter or dashed lines for hidden edges where needed. Keep the viewpoint consistent;
      introduce context and vegetation in the final frame. Follow your Graphic Standards Manual.
    - "Use at least three primitives. Include translation (move), rotation and
      scale, plus union and difference. Intersection is shown in class and
      optional here. In each subtraction, label the solid you keep and the
      cutter."
    - Draw the final solid at building scale with a 1.75 m figure, vegetation, ground and shadow.
    - "Beside the diagrams, add clear instructions and matching pseudocode — one
      step per operation, with the exposed parameters."
    - "Refer to Di Mari and Yoo's Operative Design and Di Mari's Conditional
      Design, and name the spatial operation your sequence explores."
    - "Submit your editable graph with its exposed inputs and every operation
      still in place."
    deliverable: One 17 x 11 inch diagram sheet with matching instructions (pseudocode); PDF and editable graph.
    brief:
      description: "Build a CSG object you can still edit, and explain how it is
        made as a sequence someone else can follow. Use a BIG-style massing
        diagram: one operation per frame, the same viewpoint throughout and a
        visible change between steps. Put the diagram sequence and one matching
        set of instructions (pseudocode) on the same 17 x 11 inch sheet, then
        make one 3D printed object in P2b."
      parameters:
      - "Expose the primitive dimensions, move values, rotation
        angle/axis/center and scale factor. Name each input by what it does
        geometrically, and state its units."
      - "Define the origin and axes, where each primitive starts, and the order
        of each Boolean. In a difference, identify the solid you keep and the
        cutter you remove."
      - "Keep the operations editable. Keep Blender's native node names and use
        Frames or groups to explain the sequence. Work in Blender Geometry Nodes
        or an already approved Rhino/Grasshopper route."
      studies:
      - "**Six to nine numbered frames.** Start with at least three primitive
        solids. Include translation, rotation, scale, union and difference;
        intersection is optional. Mark what is added and what is removed so each
        change reads without guessing. Each frame shows one operation or type of
        operation, with its values."
      - "**Matching instructions (pseudocode).** Put one instruction beside each
        frame. Refer to objects by type, position or step number; add names once
        the sequence is complex enough to need them. State units and axes once,
        then give enough dimensions, moves and other transforms for someone to
        rebuild the result. You don't have to name every in-between solid."
      - "**BIG-style graphic language.** Keep building masses white and use your
        palette to highlight added, removed or changed geometry. Use strong
        outer outlines, lighter secondary edges and dashed hidden edges where
        useful. Watch the [diagram
        tutorial](https://www.youtube.com/watch?v=8Y5Rn3bDL5s), also listed in
        Resources. Save vegetation and other context for the final frame."
      - "**Final solid at building scale.** Show the final geometry with a 1.75
        m figure, vegetation, ground and shadow. Keep this presentation context
        separate from the CSG object you will print. Name the spatial operation
        you explored, with a reference to Operative Design or Conditional
        Design."
      workflow:
      - Choose a spatial operation from the readings, sketch a sequence and build it from primitives using
        an editable graph.
      - "Check the order of the Booleans and change an exposed input. Make sure
        everything after it updates without rebuilding the graph."
      - "Write the steps from your working model. Ask a partner to find any
        size, position or object you left undefined, and fix those
        instructions."
      - "Export the view of each operation from one camera and lay out the
        single sheet with your Graphic Standards Manual. Make sure every frame
        matches the current graph."
      deliverables:
      - '**One 17 x 11 inch landscape PDF sheet:** `Lastname_Firstname_P2a.pdf`. Include all numbered frames,
        adjacent instructions/pseudocode, exposed values, the final architectural view and source credits.'
      - "**Editable graph:** `.blend`, or `.gh` plus `.3dm` if used. Internalize
        Grasshopper referenced geometry and include any other files the graph
        needs. A baked mesh or screenshots alone can't show the operation
        history."
      - "Submit in `Lastname_Firstname_P2a/`. Keep the object for the separate
        P2b print."
      evaluation:
      - "**Computational understanding - 30%:** explain the transforms, which
        solids each Boolean uses and in what order; show how an exposed input
        changes the result."
      - "**Visual communication - 30%:** the diagram and pseudocode agree, and
        consistent views explain each change and the final spatial result,
        following your Graphic Standards Manual."
      - "**Technical execution - 25%:** the required operations stay editable;
        the dimensions, axes, operands and instructions are enough to rebuild
        it; the submission files are complete."
      - "**Exploration - 15%:** purposeful parameter tests and your chosen
        sequence support the spatial effect you intended."
      checklist:
      - Six to nine frames; at least three primitives; translation, rotation, scale, union and difference.
        Intersection is optional.
      - Difference frames label the kept solid and cutter.
      - Instructions and pseudocode match the graph and include parameter values.
      - Final view includes a 1.75 m figure, vegetation, ground and shadow.
      - "One sheet, and an editable file that opens with everything it needs."
    number: '2.1'
    due_time: '23:59'
  - id: P2b
    title: CSG 3D printed object
    kind: fabrication
