description: |
  Use computational methods to make architectural drawings, models and physical parts. Build editable geometry, organize it with rules and explain your design decisions through clear visual work.

  **Weeks 1–10:** Graphic Standards Manual → Constructive Solid Geometry → Descriptive Geometry → Arrays → Attractor. Diagram and 3D print a CSG object, build a module from points and faces, array it in 1D, 2D and 3D and along hexagonal, radial and curve patterns, then draw a 2D attractor field and map a site in layers. 3D printing is introduced in Week 3; the print is due in Week 10.

  **Weeks 10–15:** Volumetric Data and Fields → Discretizing Geometry → Final. Model a volume with signed distance fields, slice it into sections, then laser-cut and assemble the final work. Dates in this second half may still change. Tessellation, panelization, lattices and simulation are optional, with no separate required submission.

  Use the Graphic Standards Manual throughout. Composition, hierarchy, line weight, color, rendering and photography should make both the result and its process readable.
pacing: |
  **Week 10 is the mid-semester deadline:** everything through Arrays — the manual, the CSG sheet and print, the module and the arrays — must be submitted by then. It is a regular class, not a review. After the Week 1 introduction, each topic has two classes for demonstration and practice, and each assignment has two weeks from brief to deadline: the 2D attractor drawing is due in Week 10 and the layered site analysis in Week 11. Arrays runs over two classes: 1D, 2D and 3D arrays in Week 6, then hexagonal, radial and curve arrays in Week 7.

  Teaching dates and deadlines after Week 10 are provisional. Until a change is announced in class and on Canvas, use the listed deadlines. October 5–9 and December 1–4 are reserved for studio reviews, with no graded submissions for this course.
format: |
  Each class combines a short demonstration, guided practice and critique. Start with a small example, check how it works, then increase its complexity. Watch the video tutorial for the topic where one is posted.

  Bring your editable file to every class. Be ready to change an input, predict the result and explain the relevant nodes. Reviews assess both the visual work and your understanding of the process.

  Plan for at least six hours outside class each week, including fabrication preparation, tests and documentation. Classes and scheduled FabLab work meet in person.
outcomes:
  - Produce coherent architectural drawings, renders and documentation using a personal visual identity.
  - Explain a parameter, vector, point, vertex, edge, face and closed solid, and construct a simple mesh from its parts.
  - Build a non-destructive graph using translation, rotation, scale and Boolean operations, with useful inputs exposed.
  - Use lists, indices, repetition, nested repetition and conditional selection to organize geometry.
  - Measure and remap distances to single-point, multiple-point and curve attractors, and explain the resulting variation.
  - Extend a row into a grid and a 3D array, explain Count cubed, and connect discrete XYZ locations to later volume sampling.
  - Import and document a point cloud, analyze its samples and explain the choices involved in converting them into a volume.
  - Distinguish a mesh, sampled density and a signed distance field; control an implicit volume and extract a surface or sections.
  - Prepare and assemble fabricated parts while accounting for units, material, thickness, tolerance, orientation and machine constraints.
  - Explain and revise a computational process through editable files, diagrams, controlled comparisons and physical tests.
software: |
  **Blender Geometry Nodes is the environment for the class files currently being prepared.** The earlier syllabus also allowed Rhino + Grasshopper. Continued support for that route is a discussion item; students should not be required to switch an already approved environment without an announced transition. Python is not a prerequisite for the core sequence.

  Use Illustrator, Photoshop, InDesign, Inkscape, GIMP, Scribus or an equivalent vector/raster/layout editor for visual work. Use the FabLab-specified slicer and cutting preparation workflow for production.

  Template-based design tools may not produce the sheets, Graphic Standards Manual or booklet. The grid, typography, hierarchy and composition are student design work. Retain the earlier restriction on Canva, Adobe Express, template-based Figma work, PowerPoint, Google Slides and similar template-driven production.

  Import a supplied or properly attributed point-cloud dataset for the point-cloud unit. A paid capture service, personal API key or particular importer is not required by this draft. Record source, permission or license, units and processing. An imported surface sampled into points must be identified as a derived point cloud.
presentation: |
  Use **17 × 11 inch** sheets and booklet pages, following the Graphic Standards Manual. Submit a PDF and the editable computational file for each visual milestone. Include a clear result, a diagram of the procedure, the relevant parameter values and a concise explanation of the design decision. Source attribution belongs on the sheet or its documentation page.

  Keep native node names visible. Use Frames for short explanations and name exposed input parameters clearly. Students may name their own reusable groups, but custom labels must not conceal which native node is being taught. Small readable graphs are preferred to unnecessary complexity.

  Before each submission, open the file from a clean folder, confirm dependencies and units, and check that changing the exposed inputs produces the claimed alternatives. Supplied specialist groups are permitted for volume and section operations when students can explain their inputs, outputs and role. Students build the geometry, repetition, conditionals and attractor relationships in the early exercises. P3d uses the Mixtli add-on; students must explain its inputs, output and their interpretation.
fabrication: |
  Complete FabLab Safety Orientation before machine use. The target is the end of Week 2; confirm enrollment and operating arrangements with the lab. Introduce 3D printing in Week 3.

  **CSG print (P2b):** print the CSG object from P2a. Maximum 60 mm on each axis and 200 g of filament including failed attempts. Use a draft layer height and an orientation that prints without supports.

  **Laser-cut volume (P4b):** fabricate the P4a volume as at least 12 ordered slices. Maximum 300 mm on each assembled axis and one confirmed sheet of material. Confirm stock and sheet dimensions, test kerf and fit, then label and nest the parts. Test cuts and failed parts count against the allocation.

  These are the two required physical outputs. Material availability and machine time require FabLab confirmation. Keep backups and account for replacement material beyond the confirmed allocation.
ai: |
  The core course teaches graphs and geometric reasoning. No required Python or AI tool-building final is assigned in this working draft; that decision remains open.

  **Through Week 10:** students produce their own graphs, geometry, layouts and submission material. AI may explain a concept, syntax or an error message, but may not write, complete or repair submitted work.

  **After Week 10:** code assistance may be used only where an assignment explicitly permits it. Students write their own procedure or pseudocode first, disclose the tool/version and prompts, record what was kept or changed, and verify the result. This permission does not replace the required node-based exercises or authorize AI production of the visual work.

  Generative image production, generative fill, AI upscaling, and AI generation of a visual identity, palette or layout remain prohibited for submitted coursework. Students remain responsible for every submitted result and must be able to explain and modify it. Citation follows the University's AI policy retained below.
assessment_notes: |
  The course has four projects made of nine assignments. Each assignment is graded once; a project is the set of its assignments, not an extra grade.

  Digital assignments: visual quality 35%, computational understanding 25%, technical execution 20%, experimentation 10%, requirements and visual identity 10%. Fabrication assignments: visual documentation 20%, computational understanding 20%, technical execution 15%, fabrication quality 30%, experimentation 5%, requirements and visual identity 10%.

  GSM: visual quality and hierarchy 40%, consistency and usability 30%, tested applications 20%, completeness 10%. The manual does not require a computational graph.

  Final booklet: substantive revision 40%, documentation 35%, visual identity 25%. The booklet does not replace earlier assignment grades. Standing late-work and revision policies apply.
