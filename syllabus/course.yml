vocabulary:
  - [parameter, "An input you can change that controls a relationship or a
    result.", 'Width, Depth and Height on the pyramid.']
  - [vector, "A set of X, Y and Z values that gives a direction and a length
    (magnitude). The same values can also give a position measured from the
    origin.", 'A displacement of (0, 0, 1) moves a point upward one model unit.']
  - [point, 'A location in space.', 'One XYZ position.']
  - [vertex, "A corner point of a mesh; edges and faces are built from these
    points.", 'A corner of the pyramid. The plural is vertices.']
  - [line or curve, "A one-dimensional path; the example line joins two
    positions.", "A
    curve is a different kind of geometry from a mesh edge."]
  - [edge, "A straight connection between two mesh vertices.", 'One side of a face boundary.']
  - [face, "A mesh surface bounded by vertices and edges, taken in order around
    its outline.", 'One triangular side of the pyramid.']
  - [mesh, "Vertices, edges and faces together. A mesh can be open or closed.", 'Four triangular sides plus a base make the pyramid mesh.']
  - [solid, "A shape that encloses a volume. For the solid exercises its mesh
    must be closed, with all faces pointing outward.", 'The capped pyramid before Boolean subtraction.']
  - [Boolean, "Union joins shapes, intersection keeps only where they overlap,
    and difference cuts one shape out of another.", 'Cube minus pyramid.']
  - [list and index, "A list is a set of items in order; the index is an item's
    position in that list.", "Array
    points are numbered from zero. In Blender, a node works on every point at
    once rather than taking a list as an input."]
  - [loop, "An operation repeated a set number of times; each round can pass its
    result to the next.", 'Repeat Input and Repeat Output define a Repeat Zone.']
  - [nested loop, "A repetition inside another repetition.", "For
    every row of a grid, the loop makes all its columns."]
  - [conditional, "A test that chooses a value, or chooses which copies change.", "Compare
    plus Switch; Boolean Math combines tests such as \"between two values\"."]
  - [field, "A value calculated for every point or element — for example, one
    value per copy in an array.", "Distance
    calculated at every array point; later, a single value measured throughout a
    volume."]
  - [attractor, "A point, group of points or curve you place in the model; its
    distance from each element drives a parameter.", "Distance
    rescaled (remapped) into the height of each piece."]
  - [tessellation and lattice, "A tessellation covers a surface with cells; a
    lattice is a connected network of members in space.", "A
    paneled surface, and a system of nodes and struts."]
  - [point cloud, "A collection of points measured in space, which may also
    carry data such as color.", "Imported
    site data; keep a record of its source and scale."]
  - [voxel, "One cell of a three-dimensional grid — a 3D pixel.", "Smaller cells
    capture finer detail but take more memory and time to compute."]
  - [signed distance field, "A volume in which every cell stores its distance to
    the surface, with one sign for inside and the other for outside.", "The
    surface is where the distance is zero. Density or noise values are not
    automatically distances."]
  - [discretization, "Describing a continuous form with a limited number of
    samples or parts.", "Turning
    a volume into contour sections, in order, with material thickness."]
materials_status: |
  Use the posted lessons, presentations and example files as learning references. Explained mathematics can remain in the teaching material; the revised briefs define the simpler submission requirements.

  For Project 4, instructors provide generative texture/SDF/volume groups, SDF Boolean operators for 4.2 and contouring tools with usage notes before each stage begins. Students construct their own two-parameter matrix. Existing point-cloud examples are optional references, not a required analysis assignment. No new recording or teaching package is claimed as posted until it is linked and checked.

  Confirm final-project material stock and machine slots before production. The current briefs take precedence over old assignment instructions inside presentation decks; the explanatory mathematics in those decks remains useful.

references:
  readings:
    - 'Wassily Kandinsky, Point and Line to Plane — conceptual reference for geometry and graphic relationships.'
    - 'Robert Woodbury, Elements of Parametric Design — relationships, dependencies and change.'
    - 'Casey Reas, Chandler McWilliams and LUST, Form+Code — repetition, transformation and visualization.'
    - 'Arturo Tedeschi, AAD Algorithms-Aided Design — an additional Grasshopper reference where that environment is supported.'
    - 'Diego García Cuevas and Gianluca Pugliese, Advanced 3D Printing with Grasshopper: Clay and FDM — fabrication and toolpath reference.'
    - 'Anthony Di Mari and Nora Yoo, Operative Design: A Catalog of Spatial Verbs — the CSG operations named as spatial acts; primary reference for the massing sequence.'
    - 'Anthony Di Mari, Conditional Design: An Introduction to Elemental Architecture — the companion volume; operations driven by a condition or rule.'
    - 'Neil Spiller, Drawing Architecture; Peter Cook, Drawing: The Motive Force of Architecture — architectural drawing and visual communication.'
  manuals:
    - ['NYCTA Graphics Standards Manual (1970)', 'https://archive.org/details/nycta-gs-manual', 'Massimo Vignelli and Bob Noorda, Unimark International. A binder of cases: every sign in the New York subway drawn at size with its rule beside it. Full scan.']
    - ['NASA Graphics Standards Manual (1975, NHB 1430-2)', 'https://archive.org/details/NASA_Graphics_Standards_Manual', 'Richard Danne and Bruce Blackburn. One mark, and a hundred pages of where it is allowed to go. What is designed is the consistency. Full scan, public domain.']
    - ['Munich 1972 — visual design guidelines', 'https://www.otlaicher.de/en/articles/the-rainbow-games/', 'Otl Aicher, 1967–1972. A grid, a fixed set of angles and one component varied across a whole field of pictograms. A restricted palette held for four years.']
  precedents:
    - ['@mmnksr', 'https://www.instagram.com/mmnksr/', 'Point-cloud and section imagery; compare representation choices.']
    - ['@mantissa.xyz', 'https://www.instagram.com/mantissa.xyz/', 'A second point-cloud/section reference for visual comparison.']
    - ['@saul_kim_', 'https://www.instagram.com/saul_kim_/', 'Composition, restraint and spatial legibility.']
    - ['@facadepot', 'https://www.instagram.com/facadepot/', 'Components, façades and controlled variation.']
  documentation:
    - ['BIG-style process diagram tutorial', 'https://www.youtube.com/watch?v=8Y5Rn3bDL5s', 'CSG 2.1: reference for the operation sequence and graphic presentation.']
    - ['Three-point lighting tutorial', 'https://www.youtube.com/watch?v=RDbrOpnIY7Q', 'Module 3.1: reference for one consistent key, fill and rim/back lighting strategy across three panel variations.']
    - ['Blender Repeat Zone', 'https://docs.blender.org/manual/en/5.2/modeling/geometry_nodes/utilities/repeat_zone.html', 'Explicit iteration with Repeat Input and Repeat Output.']
    - ['Blender Field to Grid', 'https://docs.blender.org/manual/en/5.2/modeling/geometry_nodes/volume/operations/field_to_grid.html', 'Sampling fields on a voxel-grid topology.']
    - ['Blender SDF Grid Offset', 'https://docs.blender.org/manual/en/5.2/modeling/geometry_nodes/volume/operations/sdf_grid_offset.html', 'Distance-based offset of an SDF surface.']
    - ['Blender 5.2 manual', 'https://docs.blender.org/manual/en/5.2/index.html', 'Check exact node behavior against the version used to prepare the lesson.']
  note: "No textbook is required. The references below support the lessons;
    lesson files and tutorials are linked from each class page."
instructor_notes: |
  October 19 confirmed assignment revision: simplify student instructions around observable learning and architectural application. Preserve P1 graphic standards, P2 procedural, P3 parametric and P4 generative. Keep explained mathematics in teaching presentations; remove formula-heavy presentation requirements from assignment briefs.

  Keep the instructor's requested numbering: 3.2.1, 3.2.2 and 3.2.3 are parts of one Arrays assignment; 3.4 is the three-attractor study; 3.5 is an architectural application. There is no separate 3.3 assignment. The study is formative, not a new weighted submission. Reuse the module, architecture and study sheet rather than requiring separate design starts.

  Review completed midterm work as submitted. New architectural evidence, intersection demonstrations or revised sheet arrangements are not retrospective requirements. Keep the October 18 Teams deadline and recorded first-five weights. Use 10/15/10 across the three Project 4 stages, retaining its 35% total. Weekly deadlines are October 27 for 3.4-3.5, November 3 for 4.1, November 10 for 4.2 and November 17 for the physical and digital 4.3 submission.

  4.1 is a student-built matrix with two parameters at five values each. Provide only the field tools and guidance. 4.2 refines one result using field controls and optional instructor-provided SDF Boolean operators into a pavilion or small-shop envelope within 12 m in each direction; require plan, section and isometric of the same proposal. 4.3 fabricates that proposal through contours and registration. Point-cloud analysis and the former 4.4 stage are removed from required assignments.

  Teach 3.4 and introduce 3.5 in Week 9, matrix construction in Week 10, architectural refinement in Week 11 and fabrication preparation in Week 12. Week 13 receives the completed contour model; Weeks 13-15 provide feedback, revisions and booklet preparation. Existing examples may remain as supplementary teaching references; they are not additional assignments. All four projects now have concise synchronized PDF briefs. Keep standing policies unchanged.

home:
  tagline: Build geometry with rules, vary it with data and communicate it through drawings, models and physical
    parts.
  welcome: |
    Welcome to ARC 3133. This course is about describing architecture as a set of rules — operations, points and faces, arrays and fields — and turning that description into clear drawings, renders and physical objects: a CSG print, an attractor-driven façade and a laser-cut generative model.

    We work mainly in Blender Geometry Nodes, and the video tutorials also cover Rhino + Grasshopper. No programming experience is needed: you build with nodes, and each lesson shows the same steps written as short pseudocode so you learn to read it.
  tabs:
  - - Classes
    - /classes/overview/
    - One page per class, in order. Each has the slides, the video tutorials, the Blender example files, what to
      practice and what is due. Start here every week.
  - - Assignments
    - /assignments/overview/
    - The four projects and their learning goals, submissions, dates and grading.
  - - Tutorials
    - /tutorials/how-tutorials-work/
    - Lesson notes and video tutorials for each topic. Use them to review a class, catch up, or work through a step
      at your own pace.
  - - Resources
    - /resources/overview/
    - The syllabus and course policies, software and materials, readings, visual precedents, and every example file
      and screenshot in one place.
  how_we_work: |
    Each class is a short demonstration, then guided practice and critique. Bring your editable file every week: you should be able to change an input, predict what happens and explain why. Your Graphic Standards Manual sets the look of every sheet you present.

    Fabrication runs through the semester: a 3D print in Project 2 and a laser-cut model in Project 4, with optional printed components. Complete the FabLab Safety Orientation before using any machine.

